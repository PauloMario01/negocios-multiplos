function KnowledgeCenterView({ db, setDb, flash, accessToken }) {
  const [query, setQuery] = useState("");
  const [sheet, setSheet] = useState(null);
  const api = sbTable("knowledge_items", accessToken);

  const list = (db.knowledgeItems || []).filter((k) => !query || k.titulo.toLowerCase().includes(query.toLowerCase()) || k.categoria.toLowerCase().includes(query.toLowerCase()));
  const activeCount = (db.knowledgeItems || []).filter((k) => k.estado === "Active").length;

  const save = async (data) => {
    try {
      if (data.id) {
        const row = await api.update(data.id, mapOut.knowledgeItem(data));
        const updated = mapIn.knowledgeItem(row);
        setDb((prev) => ({ ...prev, knowledgeItems: prev.knowledgeItems.map((k) => (k.id === updated.id ? updated : k)) }));
        flash("Item actualizado");
      } else {
        const row = await api.insert(mapOut.knowledgeItem(data));
        const created = mapIn.knowledgeItem(row);
        setDb((prev) => ({ ...prev, knowledgeItems: [created, ...prev.knowledgeItems] }));
        flash("Item criado");
      }
      setSheet(null);
    } catch (e) {
      flash(`Erro ao guardar: ${e.message}`);
    }
  };

  const archive = async (k) => {
    try {
      const row = await api.update(k.id, { estado: "Archived" });
      const updated = mapIn.knowledgeItem(row);
      setDb((prev) => ({ ...prev, knowledgeItems: prev.knowledgeItems.map((x) => (x.id === k.id ? updated : x)) }));
      flash("Item arquivado");
    } catch (e) {
      flash(`Erro: ${e.message}`);
    }
  };

  return (
    <div className="pb-6">
      <div style={{ color: C.green, background: C.greenTint }} className="rounded-xl p-3 mb-4 text-xs font-semibold flex items-center gap-2">
        <ClipboardCheck size={14} /> {activeCount} {activeCount === 1 ? "item activo" : "itens activos"} — só estes são usados pela Sheila para responder.
      </div>
      <ListHeader query={query} setQuery={setQuery} placeholder="Procurar por título ou categoria…" onAdd={() => setSheet({ mode: "new", data: emptyKnowledgeItem() })} addLabel="Novo item" />
      {list.length === 0 ? (
        <EmptyState icon={ClipboardCheck} title="Sem itens na base de conhecimento" subtitle="Cada item aqui é o que a Sheila vai usar para responder — sem inventar." action={<PrimaryButton icon={Plus} onClick={() => setSheet({ mode: "new", data: emptyKnowledgeItem() })}>Novo item</PrimaryButton>} />
      ) : (
        <div className="grid gap-3">
          {list.map((k) => (
            <div key={k.id} style={{ background: C.card, borderColor: C.line }} className="rounded-2xl border p-4">
              <div className="flex items-start justify-between gap-2">
                <div className="min-w-0">
                  <p style={{ ...fontDisplay, color: C.ink }} className="font-semibold truncate">{k.titulo}</p>
                  <p style={{ color: C.muted }} className="text-xs">{k.categoria} · prioridade {k.prioridade}</p>
                </div>
                <Pill tone={k.estado === "Active" ? "green" : k.estado === "Archived" ? "red" : "gold"}>{KNOWLEDGE_ESTADO_LABEL[k.estado]}</Pill>
              </div>
              <p style={{ color: C.ink }} className="text-sm mt-2 line-clamp-3">{k.conteudo}</p>
              <div className="flex items-center gap-2 mt-3">
                <button onClick={() => setSheet({ mode: "edit", data: k })} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.green }}><Pencil size={12} /> Editar</button>
                {k.estado !== "Archived" && <button onClick={() => archive(k)} className="text-xs font-semibold flex items-center gap-1 ml-auto" style={{ color: C.muted }}><Archive size={12} /> Arquivar</button>}
              </div>
            </div>
          ))}
        </div>
      )}
      <Sheet open={!!sheet} onClose={() => setSheet(null)} title={sheet?.mode === "new" ? "Novo item" : "Editar item"}>
        {sheet && <KnowledgeItemForm data={sheet.data} db={db} onCancel={() => setSheet(null)} onSave={save} />}
      </Sheet>
    </div>
  );
}

function KnowledgeItemForm({ data, db, onCancel, onSave }) {
  const [form, setForm] = useState(data);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  return (
    <form onSubmit={(e) => { e.preventDefault(); onSave(form); }}>
      <Field label="Título"><TextInput required value={form.titulo} onChange={set("titulo")} /></Field>
      <Field label="Categoria">
        <Select value={form.categoria} onChange={set("categoria")}>{KNOWLEDGE_CATEGORIAS.map((c) => <option key={c}>{c}</option>)}</Select>
      </Field>
      <Field label="Produto associado (opcional)">
        <Select value={form.productId} onChange={set("productId")}>
          <option value="">—</option>
          {(db.products || []).map((p) => <option key={p.id} value={p.id}>{p.nome}</option>)}
        </Select>
      </Field>
      <Field label="Conteúdo" hint="Isto é o que a Sheila vai ler para responder — escreve como se estivesses a explicar a um novo colega."><TextArea rows={6} required value={form.conteudo} onChange={set("conteudo")} /></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Prioridade (1-10)"><TextInput type="number" min="1" max="10" value={form.prioridade} onChange={set("prioridade")} /></Field>
        <Field label="Estado">
          <Select value={form.estado} onChange={set("estado")}>{KNOWLEDGE_ESTADOS.map((s) => <option key={s} value={s}>{KNOWLEDGE_ESTADO_LABEL[s]}</option>)}</Select>
        </Field>
      </div>
      <div className="flex gap-2 mt-2">
        <GhostButton onClick={onCancel} full>Cancelar</GhostButton>
        <PrimaryButton type="submit" full icon={Check}>Guardar</PrimaryButton>
      </div>
    </form>
  );
}

/* ======================================================================
   SHEILA — painel de teste
====================================================================== */
function SheilaTestView({ db, accessToken }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  const send = async (e) => {
    e.preventDefault();
    if (!input.trim() || busy) return;
    const userMsg = { role: "user", content: input.trim() };
    setMessages((m) => [...m, userMsg]);
    setInput("");
    setBusy(true);
    setError("");
    try {
      const res = await withTimeout(
        fetch(`${SUPABASE_URL}/functions/v1/sheila-chat`, {
          method: "POST",
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
          body: JSON.stringify({ message: userMsg.content, history: messages }),
        }),
        20000
      );
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      setMessages((m) => [...m, { role: "assistant", content: data.reply, escalate: data.escalate, escalateReason: data.escalateReason }]);
    } catch (e) {
      setError(e.message === "timeout" ? "A Sheila demorou demasiado a responder." : `Erro: ${e.message}`);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="pb-6">
      <div style={{ background: "#FBF3DC", color: "#8A6D14" }} className="rounded-xl p-3 mb-4 text-xs font-semibold flex items-center gap-2">
        <Lock size={14} /> Painel de teste interno — a Sheila ainda não está ligada a leads reais, é só para confirmares que a IA está a responder correctamente.
      </div>

      <div style={{ background: C.card, borderColor: C.line }} className="rounded-2xl border p-4 mb-4 min-h-[300px] flex flex-col gap-3">
        {messages.length === 0 && (
          <p style={{ color: C.muted }} className="text-sm text-center py-10">Escreve uma mensagem como se fosses um lead a perguntar sobre o produto.</p>
        )}
        {messages.map((m, i) => (
          <div key={i} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
            <div style={{ background: m.role === "user" ? C.green : "#F1F0EC", color: m.role === "user" ? "white" : C.ink }} className="rounded-2xl px-3.5 py-2.5 max-w-[85%] text-sm">
              {m.content}
              {m.escalate && (
                <p style={{ color: m.role === "user" ? "white" : C.red }} className="text-[10px] font-bold mt-1.5 flex items-center gap-1"><AlertTriangle size={11} /> Escalado para humano: {m.escalateReason}</p>
              )}
            </div>
          </div>
        ))}
        {busy && <p style={{ color: C.muted }} className="text-xs">Sheila está a escrever…</p>}
      </div>

      {error && <p style={{ color: C.red }} className="text-xs mb-2">{error}</p>}

      <form onSubmit={send} className="flex gap-2">
        <TextInput value={input} onChange={(e) => setInput(e.target.value)} placeholder="Escreve uma mensagem…" className="flex-1" />
        <PrimaryButton type="submit" icon={Check}>{busy ? "…" : "Enviar"}</PrimaryButton>
      </form>
    </div>
  );
}

function ConfiguracoesView({ db, setDb, flash, accessToken }) {
  const [form, setForm] = useState(db.settings);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  const api = sbTable("settings", accessToken);

  const save = async (e) => {
    e.preventDefault();
    try {
      const row = await sbFetch(`/rest/v1/settings`, {
        method: "POST", body: mapOut.settings(form), accessToken, prefer: "resolution=merge-duplicates,return=representation",
      });
      setDb((prev) => ({ ...prev, settings: mapIn.settings(row[0]) }));
      flash("Configurações guardadas");
    } catch (e) {
      flash(`Erro ao guardar: ${e.message}`);
    }
  };

  const exportCsv = (name, rows) => {
    if (!rows.length) { flash("Sem dados para exportar"); return; }
    const headers = Object.keys(rows[0]);
    const csv = [headers.join(","), ...rows.map((r) => headers.map((h) => `"${String(r[h] ?? "").replace(/"/g, '""')}"`).join(","))].join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${name}.csv`; a.click();
    URL.revokeObjectURL(url);
    flash(`${name}.csv exportado`);
  };

  return (
    <div className="pb-6">
      <SectionCard title="Configurações globais">
        <form onSubmit={save}>
          <Field label="Nome da empresa"><TextInput value={form.companyName} onChange={set("companyName")} /></Field>
          <Field label="WhatsApp oficial"><TextInput value={form.whatsappOficial} onChange={set("whatsappOficial")} /></Field>
          <Field label="Email"><TextInput value={form.email} onChange={set("email")} /></Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Moeda"><TextInput value={form.moeda} onChange={set("moeda")} /></Field>
            <Field label="Duração do acompanhamento (dias)"><TextInput type="number" value={form.duracaoAcompanhamento} onChange={set("duracaoAcompanhamento")} /></Field>
          </div>
          <Field label="Mensagem padrão"><TextArea rows={2} value={form.mensagemPadrao} onChange={set("mensagemPadrao")} /></Field>
          <PrimaryButton type="submit" full icon={Check}>Guardar configurações</PrimaryButton>
        </form>
      </SectionCard>

      <SectionCard title="Exportação de dados (CSV)">
        <div className="grid grid-cols-2 gap-2">
          <GhostButton icon={Download} onClick={() => exportCsv("influencers", db.influencers)}>Influencers</GhostButton>
          <GhostButton icon={Download} onClick={() => exportCsv("leads", db.leads)}>Leads</GhostButton>
          <GhostButton icon={Download} onClick={() => exportCsv("clientes", db.clients)}>Clientes</GhostButton>
          <GhostButton icon={Download} onClick={() => exportCsv("vendas", db.sales)}>Vendas</GhostButton>
          <GhostButton icon={Download} onClick={() => exportCsv("comissoes", db.commissions)}>Comissões</GhostButton>
          <GhostButton icon={Download} onClick={() => exportCsv("pagamentos", db.payments)}>Pagamentos</GhostButton>
          <GhostButton icon={Download} onClick={() => exportCsv("campanhas", db.campaigns)}>Campanhas</GhostButton>
        </div>
        <p style={{ color: C.muted, ...fontBody }} className="text-xs mt-3">Dados sensíveis (IBAN, titular) são exportados tal como guardados — confirma antes de partilhar o ficheiro.</p>
      </SectionCard>

      <SectionCard title="Sobre este sistema">
        <p style={{ color: C.muted, ...fontBody }} className="text-xs leading-relaxed">
          Esta é uma versão MVP com persistência local por conta, sem servidor próprio. Para autenticação real com múltiplos utilizadores, permissões ao nível da base de dados (RLS) e audit log à prova de adulteração, é necessário migrar para um backend dedicado (ex. Supabase/Firebase).
        </p>
      </SectionCard>
    </div>
  );
}

ReactDOM.createRoot(rootEl).render(<App />);
