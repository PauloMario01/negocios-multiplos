<script>
  if (!window.storage) {
    window.storage = {
      get: async (key) => {
        const v = localStorage.getItem(key);
        return v !== null ? { key, value: v, shared: false } : null;
      },
      set: async (key, value) => {
        localStorage.setItem(key, value);
        return { key, value, shared: false };
      },
      delete: async (key) => {
        localStorage.removeItem(key);
        return { key, deleted: true, shared: false };
      },
      list: async (prefix) => {
        const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
        return { keys, prefix, shared: false };
      },
    };
  }
</script>

<script>
  window.__nmosErrors = [];
  function __nmosShowError(msg) {
    window.__nmosErrors.push(msg);
    var root = document.getElementById("root");
    if (!root) return;
    if (!root.dataset.nmosErrorBox) {
      root.dataset.nmosErrorBox = "1";
      root.innerHTML = '<div style="padding:20px;font-family:sans-serif;background:#FBEAE3;color:#7A1F0A;white-space:pre-wrap;line-height:1.5;font-size:14px;"><b>Erro ao carregar a app — mostra isto ao Claude:</b><br><br><div id="nmos-error-list"></div></div>';
    }
    var list = document.getElementById("nmos-error-list");
    if (list) {
      var line = document.createElement("div");
      line.style.marginBottom = "10px";
      line.style.paddingBottom = "10px";
      line.style.borderBottom = "1px solid #e8c4b8";
      line.textContent = msg;
      list.appendChild(line);
    }
  }
  window.addEventListener("error", function (e) {
    var msg = e.message || "Script error.";
    if (e.filename) msg += "\n  em: " + e.filename + (e.lineno ? (":" + e.lineno) : "");
    __nmosShowError(msg);
  });
  window.addEventListener("unhandledrejection", function (e) {
    var reason = e.reason;
    var msg = (reason && (reason.stack || reason.message)) ? (reason.message || String(reason)) : String(reason);
    __nmosShowError("Promise rejeitada: " + msg);
  });
  setTimeout(function () {
    var root = document.getElementById("root");
    if (root && !root.dataset.nmosErrorBox && root.textContent.indexOf("A carregar") !== -1) {
      __nmosShowError("Nada carregou em 10 segundos. Provável causa: um script externo não carregou nesta rede.");
    }
  }, 10000);
</script>

async function sbFetch(path, { method = "GET", body, accessToken, prefer } = {}) {
  const res = await fetch(`${SUPABASE_URL}${path}`, {
    method,
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${accessToken || SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      ...(prefer ? { Prefer: prefer } : {}),
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let msg = `${res.status}`;
    try { const j = await res.json(); msg = j.message || j.msg || msg; } catch (e) {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function sbLogin(email, password) {

// CRUD genérico para uma tabela Supabase
function sbTable(name, accessToken) {
  return {
    list: () => sbFetch(`/rest/v1/${name}?select=*&order=created_at.desc`, { accessToken }),
    insert: (row) => sbFetch(`/rest/v1/${name}`, { method: "POST", body: row, accessToken, prefer: "return=representation" }).then((r) => r[0]),
    update: (id, patch) => sbFetch(`/rest/v1/${name}?id=eq.${id}`, { method: "PATCH", body: patch, accessToken, prefer: "return=representation" }).then((r) => r[0]),
    remove: (id) => sbFetch(`/rest/v1/${name}?id=eq.${id}`, { method: "DELETE", accessToken }),
  };
}

function bankingApi(accessToken) {
  return {
    get: (influencerId) => sbFetch(`/rest/v1/influencer_banking?influencer_id=eq.${influencerId}&select=*`, { accessToken }).then((r) => mapIn.banking(r?.[0])),
    upsert: (influencerId, data) =>
      sbFetch(`/rest/v1/influencer_banking`, {
        method: "POST",
        body: { influencer_id: influencerId, ...mapOut.banking(data) },
        accessToken,
        prefer: "resolution=merge-duplicates,return=representation",
      }).then((r) => mapIn.banking(r?.[0])),
  };
}

function genId(prefix, seqRef) {
  seqRef.current += 1;
  return `${prefix}${String(seqRef.current).padStart(4, "0")}`;
}

function formatKz(n) {
  const v = Number(n) || 0;
  return v.toLocaleString("pt-PT", { maximumFractionDigits: 0 }) + " Kz";
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function daysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.toISOString().slice(0, 10);
}

function pushAudit(setDb, seqRef, { utilizador = "Admin", accao, entidade, entidadeId }) {
  seqRef.current.AUD = (seqRef.current.AUD || 0) + 1;
  const id = `AUD${String(seqRef.current.AUD).padStart(4, "0")}`;
  setDb((prev) => ({
    ...prev,
    seq: { ...prev.seq, AUD: seqRef.current.AUD },
    auditLogs: [{ id, data: new Date().toISOString(), utilizador, accao, entidade, entidadeId }, ...(prev.auditLogs || [])],
  }));
}

function randCode(name) {
  const base = (name || "PARC").replace(/[^A-Za-z]/g, "").slice(0, 6).toUpperCase() || "PARC";
  return base + Math.floor(10 + Math.random() * 90);
}

====================================================================== */
function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms)),
  ]);
}

const CORE_TABLES = ["campaigns", "influencers", "leads", "clients", "sales", "commissions"];
const CORE_SINGULAR = { campaigns: "campaign", influencers: "influencer", leads: "lead", clients: "client", sales: "sale", commissions: "commission" };
const LOCAL_TABLES = ["scripts", "diagnostics", "vip_members", "documents", "tasks", "commission_payments", "social_proofs", "products", "knowledge_items", "escalations"];
const LOCAL_SINGULAR = { scripts: "script", diagnostics: "diagnostic", vip_members: "vip", documents: "document", tasks: "task", commission_payments: "payment", social_proofs: "socialProof", products: "product", knowledge_items: "knowledgeItem", escalations: "escalation" };
const LOCAL_KEY = { scripts: "scripts", diagnostics: "diagnostics", vip_members: "vipMembers", documents: "documents", tasks: "tasks", commission_payments: "payments", social_proofs: "socialProofs", products: "products", knowledge_items: "knowledgeItems", escalations: "escalations" };

async function fetchAllData(accessToken) {
  const corePromise = Promise.all(
    CORE_TABLES.map((t) => sbTable(t, accessToken).list().then((rows) => (rows || []).map(mapIn[CORE_SINGULAR[t]])))
  );
  const localPromise = Promise.all(
    LOCAL_TABLES.map((t) => sbTable(t, accessToken).list().then((rows) => (rows || []).map(mapIn[LOCAL_SINGULAR[t]])))
  );
  const [core, local, whatsappRows, settingsRows, paymentItemRows, auditRows] = await Promise.all([
    corePromise,
    localPromise,
    sbFetch(`/rest/v1/whatsapp_groups?select=*&limit=1`, { accessToken }),
    sbFetch(`/rest/v1/settings?select=*&limit=1`, { accessToken }),
    sbFetch(`/rest/v1/commission_payment_items?select=*`, { accessToken }),
    sbFetch(`/rest/v1/audit_logs?select=*&order=data.desc&limit=100`, { accessToken }),
  ]);

  const out = { campaigns: core[0], influencers: core[1], leads: core[2], clients: core[3], sales: core[4], commissions: core[5] };
  LOCAL_TABLES.forEach((t, i) => { out[LOCAL_KEY[t]] = local[i]; });

  // liga cada pagamento às suas comissões (tabela de junção)
  out.payments = out.payments.map((p) => ({
    ...p,
    commissionIds: (paymentItemRows || []).filter((it) => it.payment_id === p.id).map((it) => it.commission_id),
  }));

  out.whatsapp = whatsappRows && whatsappRows[0] ? mapIn.whatsapp(whatsappRows[0]) : null;
  out.settings = settingsRows && settingsRows[0] ? mapIn.settings(settingsRows[0]) : null;
  out.auditLogs = (auditRows || []).map((r) => ({ id: r.id, data: r.data, utilizador: r.utilizador || "Admin", accao: r.accao, entidade: r.entidade, entidadeId: r.entidade_id }));

  return out;
}

function useDB(accessToken) {
  const [db, setDb] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saveError, setSaveError] = useState(false);
  const [loadError, setLoadError] = useState(false);

  const loadOnce = useCallback(async () => {
    if (!accessToken) return;
    setLoading(true);
    setLoadError(false);
    let base;
    try {
      const res = await withTimeout(window.storage.get(STORE_KEY, false), 6000);
      base = res && res.value ? JSON.parse(res.value) : seedData();
    } catch (e) {
      base = seedData();
    }
    try {
      const remote = await withTimeout(fetchAllData(accessToken), 12000);
      // A Supabase é a fonte da verdade para todos os módulos já ligados — substitui os dados locais.
      // whatsapp/settings ainda não têm linha na base de dados na primeira vez que a app corre.
      setDb({
        ...base, ...remote,
        whatsapp: remote.whatsapp || base.whatsapp,
        settings: remote.settings || base.settings,
      });
    } catch (e) {
      // Sem ligação à base de dados real: continua com o que houver localmente para a app não ficar presa.
      setDb(base);
      setLoadError(true);
    } finally {
      setLoading(false);
    }
  }, [accessToken]);

  useEffect(() => { loadOnce(); }, [loadOnce]);

  useEffect(() => {
    if (!db || loading) return;
    const t = setTimeout(async () => {
      try {
        const r = await withTimeout(window.storage.set(STORE_KEY, JSON.stringify(db), false), 6000);
        setSaveError(!r);
      } catch (e) {
        setSaveError(true);
      }
    }, 250);
    return () => clearTimeout(t);
  }, [db, loading]);

  return [db, setDb, loading, saveError, loadError, loadOnce];
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ background: C.paper, ...fontBody }} className="min-h-screen flex items-center justify-center p-6">
          <div style={{ background: C.card, borderColor: C.line }} className="border rounded-2xl p-6 max-w-sm w-full text-center">

            <p style={{ color: C.muted }} className="text-sm mb-5">A aplicação encontrou um erro inesperado. Os teus dados guardados não foram perdidos.</p>
            <PrimaryButton full icon={RefreshCw} onClick={() => { this.setState({ error: null }); }}>Tentar novamente</PrimaryButton>

    }
    return this.props.children;
  }
}

function LoginGate({ onLogin }) {
  useBrandFonts();
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const inFlight = React.useRef(false);

  const submit = async (e) => {
    if (e && e.preventDefault) e.preventDefault();
    if (inFlight.current) return; // evita disparo duplicado se o botão for tocado duas vezes
    inFlight.current = true;
    setError("");
    setBusy(true);
    try {
      const data = await withTimeout(sbLogin(email.trim(), password), 10000);
      if (!data || !data.access_token) throw new Error(data?.error_description || data?.msg || "Credenciais inválidas");
      onLogin({ accessToken: data.access_token, email: data.user?.email || email, userId: data.user?.id });
    } catch (err) {
      const raw = err && err.message ? err.message : String(err);
      const friendly =
        raw === "timeout" ? "O pedido demorou demasiado — verifica a tua ligação e tenta de novo."
        : raw === "Failed to fetch" || raw.includes("NetworkError") ? "Não foi possível ligar à base de dados (falha de rede nesta pré-visualização)."
        : raw.toLowerCase().includes("invalid") ? "Email ou password incorrectos."
        : `Erro: ${raw}`;
      setError(friendly);
    } finally {
      setBusy(false);
      inFlight.current = false;
    }
  };

  return (
    <div style={{ background: C.green, ...fontBody }} className="min-h-screen flex items-center justify-center p-6">
      <div style={{ background: C.card }} className="w-full max-w-sm rounded-3xl p-7 shadow-2xl">

        <p style={{ color: C.gold, ...fontBody }} className="text-xs font-bold uppercase tracking-[0.14em] mb-6">Influencer Partner OS</p>
        <form onSubmit={submit}>
          <Field label="Email">
            <TextInput type="email" required value={email} onChange={(e) => setEmail(e.target.value)} autoFocus autoComplete="username" enterKeyHint="next" />
          </Field>
          <Field label="Password" hint={error || "Conta de administrador criada no Supabase."}>
            <TextInput type="password" required value={password} onChange={(e) => setPassword(e.target.value)} autoComplete="current-password" enterKeyHint="go" />
          </Field>
          <PrimaryButton type="submit" full icon={busy ? RefreshCw : ShieldCheck} onClick={submit}>
            {busy ? "A entrar…" : "Entrar"}
          </PrimaryButton>
        </form>
        <TestConnectionButton />
        <p style={{ color: C.muted }} className="text-xs mt-5 leading-relaxed">
          Login real ligado à tua base de dados Supabase. A sessão fica activa só enquanto este ecrã estiver aberto — se saíres e voltares, precisas de entrar outra vez.
        </p>
      </div>
    </div>
  );
}

const PERIODS = ["Hoje", "7 dias", "30 dias", "Este mês", "Tudo"];
/* ======================================================================
   LEAD SCORING — calculado a partir do estado real do lead, nunca inventado
====================================================================== */
const LEAD_SCORE_ESTADO = {
  "Novo": 0, "Contactado": 5, "Diagnóstico": 10, "Interessado": 20,
  "Oferta apresentada": 25, "Pagamento solicitado": 30, "Pago": 50, "Convertido": 70,
  "Follow-up": 5, "Não interessado": 0, "Perdido": 0,
};

function computeLeadScore(lead, diagnostics) {
  let score = LEAD_SCORE_ESTADO[lead.estado] ?? 0;
  const reasons = [];
  if (LEAD_SCORE_ESTADO[lead.estado]) reasons.push(`Estado actual: ${lead.estado} (+${LEAD_SCORE_ESTADO[lead.estado]})`);
  const hasDiagnostic = diagnostics.some((d) => d.leadId === lead.id);
  if (hasDiagnostic && lead.estado === "Diagnóstico") {
    score += 5; // completou, não só iniciou
    reasons.push("Diagnóstico completo (+5)");
  }
  let tier = "Frio";
  if (score >= 60) tier = "Muito quente";
  else if (score >= 40) tier = "Quente";
  else if (score >= 20) tier = "Morno";
  return { score, tier, reasons };
}
const LEAD_TIER_TONE = { "Frio": "neutral", "Morno": "gold", "Quente": "gold", "Muito quente": "green" };

/* ======================================================================
   FOLLOW-UP ENGINE — sequência D+1 / D+3 / D+7 / D+14
====================================================================== */
const FOLLOWUP_STAGES = [1, 3, 7, 14];
const FOLLOWUP_CLOSED_ESTADOS = ["Convertido", "Perdido", "Não interessado"];

function daysSince(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - d) / (1000 * 60 * 60 * 24));
}

function computeFollowUp(lead) {
  if (FOLLOWUP_CLOSED_ESTADOS.includes(lead.estado)) return { due: false };
  const baseDate = lead.ultimoContacto || lead.dataEntrada;
  const days = daysSince(baseDate);
  if (days === null) return { due: false };
  // encontra o maior marco (1/3/7/14) já atingido
  const stage = [...FOLLOWUP_STAGES].reverse().find((s) => days >= s);
  if (!stage) return { due: false, days };
  return { due: true, stage, days };
}

function followUpMessage(lead) {
  const nome = lead.nome.split(" ")[0];
  return `Olá ${nome}! Passava só para saber se ainda tens interesse em avançar — fico à disposição para qualquer dúvida. 🙂`;
}

/* ======================================================================
   GAMIFICAÇÃO — XP e níveis da Comunidade VIP
====================================================================== */
const XP_LEVELS = [
  { min: 0, nome: "Explorador" },
  { min: 30, nome: "Iniciado" },
  { min: 80, nome: "Executor" },
  { min: 150, nome: "Construtor" },
  { min: 250, nome: "Estratega" },
];
const XP_REASONS = [
  { label: "Concluir tarefa", pontos: 10 },
  { label: "Participar", pontos: 5 },
  { label: "Primeira acção", pontos: 20 },
  { label: "Partilhar resultado", pontos: 25 },
  { label: "Ajudar outro membro", pontos: 10 },
];

function computeLevel(xp) {
  let current = XP_LEVELS[0];
  let next = null;
  for (let i = 0; i < XP_LEVELS.length; i++) {
    if (xp >= XP_LEVELS[i].min) current = XP_LEVELS[i];
    else { next = XP_LEVELS[i]; break; }
  }
  const idx = XP_LEVELS.indexOf(current);
  const progress = next ? Math.round(((xp - current.min) / (next.min - current.min)) * 100) : 100;
  return { nome: current.nome, level: idx + 1, next, progress: Math.min(100, Math.max(0, progress)) };
}

function withinPeriod(dateStr, period) {
  if (!dateStr || period === "Tudo") return true;
  const d = new Date(dateStr);
  const now = new Date();
  if (period === "Hoje") return dateStr === todayISO();
  if (period === "7 dias") return d >= new Date(daysAgo(7));
  if (period === "30 dias") return d >= new Date(daysAgo(30));
  if (period === "Este mês") return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  return true;
}

function PeriodFilter({ value, onChange }) {
  return (
    <div className="flex gap-1.5 overflow-x-auto pb-1 -mx-1 px-1 no-scrollbar">

====================================================================== */
const LEAD_ESTADOS = ["Novo", "Contactado", "Diagnóstico", "Interessado", "Oferta apresentada", "Pagamento solicitado", "Pago", "Não interessado", "Follow-up", "Perdido", "Convertido"];

function emptyLead(campaignId) {
  return { nome: "", telefone: "", influencerId: "", campaignId: campaignId || "", estado: "Novo", dataEntrada: todayISO(), observacoes: "" };
}

function LeadsView({ db, setDb, seqRef, persistSeq, flash, accessToken }) {
  const [query, setQuery] = useState("");
  const [sheet, setSheet] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [confirmConvert, setConfirmConvert] = useState(null);
  const [tierFilter, setTierFilter] = useState("Todos");
  const api = sbTable("leads", accessToken);
  const clientsApi = sbTable("clients", accessToken);

  const list = db.leads
    .filter((l) => !query || l.nome.toLowerCase().includes(query.toLowerCase()) || l.telefone.includes(query))
    .map((l) => ({ ...l, __score: computeLeadScore(l, db.diagnostics) }))
    .filter((l) => tierFilter === "Todos" || l.__score.tier === tierFilter)
    .sort((a, b) => b.__score.score - a.__score.score);

  const save = async (data) => {
    try {
      if (data.id) {
        const row = await api.update(data.id, mapOut.lead(data));
        const updated = mapIn.lead(row);
        setDb((prev) => ({ ...prev, leads: prev.leads.map((l) => (l.id === updated.id ? updated : l)) }));
        flash("Lead actualizado");
      } else {
        const row = await api.insert(mapOut.lead(data));
        const created = mapIn.lead(row);
        setDb((prev) => ({ ...prev, leads: [created, ...prev.leads] }));
        flash("Lead criado");
      }
      setSheet(null);
    } catch (e) {
      flash(`Erro ao guardar: ${e.message}`);
    }
  };

  const remove = async (id) => {
    try {
      await api.remove(id);
      setDb((prev) => ({ ...prev, leads: prev.leads.filter((l) => l.id !== id) }));
      setConfirmDel(null);
      flash("Lead eliminado");
    } catch (e) {
      flash(`Erro ao eliminar: ${e.message}`);
    }
  };

  const convertToClient = async (lead) => {
    const existing = db.clients.find((c) => c.telefone === lead.telefone);
    if (existing) {
      flash("Já existe um cliente com este telefone");
      setConfirmConvert(null);
      return;
    }
    try {
      const clientPayload = mapOut.client({
        nome: lead.nome, telefone: lead.telefone, influencerId: lead.influencerId, campaignId: lead.campaignId,
        produtoAdquirido: "12 Formas de Gerar Rendimentos em Angola", dataCompra: todayISO(), valor: 0,
        estado: "Activo", diaAcompanhamento: 0, observacoes: `Convertido a partir do lead ${lead.id}.`,
      });
      const clientRow = await clientsApi.insert(clientPayload);
      const client = mapIn.client(clientRow);
      const leadRow = await api.update(lead.id, { estado: "Convertido" });
      const updatedLead = mapIn.lead(leadRow);
      setDb((prev) => ({
        ...prev,
        clients: [client, ...prev.clients],
        leads: prev.leads.map((l) => (l.id === lead.id ? updatedLead : l)),
      }));
      setConfirmConvert(null);
      flash("Lead convertido em cliente");
    } catch (e) {
      flash(`Erro ao converter: ${e.message}`);
    }
  };

  return (
    <div className="pb-6">
      <ListHeader query={query} setQuery={setQuery} placeholder="Procurar lead…" onAdd={() => setSheet({ mode: "new", data: emptyLead() })} addLabel="Novo lead" />
      <div className="flex gap-1.5 overflow-x-auto pb-1 mb-4 no-scrollbar">
        {["Todos", "Muito quente", "Quente", "Morno", "Frio"].map((t) => (
          <button key={t} onClick={() => setTierFilter(t)} style={{ background: tierFilter === t ? C.green : C.card, color: tierFilter === t ? "white" : C.ink, borderColor: C.line }} className="border px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap shrink-0">
            {t}
          </button>
        ))}
      </div>

      {list.length === 0 ? (
        <EmptyState icon={Target} title="Sem leads" subtitle="Regista o primeiro contacto vindo do grupo de WhatsApp." action={<PrimaryButton icon={Plus} onClick={() => setSheet({ mode: "new", data: emptyLead() })}>Novo lead</PrimaryButton>} />
      ) : (
        <div className="grid gap-3">
          {list.map((l) => {
            const inf = db.influencers.find((i) => i.id === l.influencerId);
            return (
              <div key={l.id} style={{ background: C.card, borderColor: C.line }} className="rounded-2xl border p-4">
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <p style={{ ...fontDisplay, color: C.ink }} className="font-semibold truncate">{l.nome}</p>
                    <p style={{ color: C.muted }} className="text-xs truncate">{inf ? (inf.nomeArtistico || inf.nome) : "Sem influencer"} {inf?.codigo ? `· ${inf.codigo}` : ""}</p>
                  </div>
                  <StatusPill status={l.estado} />
                </div>
                <div className="flex items-center gap-1.5 mt-2">
                  <Pill tone={LEAD_TIER_TONE[l.__score.tier]}>{l.__score.tier} · {l.__score.score} pts</Pill>
                  {computeFollowUp(l).due && <Pill tone="red">Follow-up D+{computeFollowUp(l).stage}</Pill>}
                </div>
                <ContactRow phone={l.telefone} whatsapp={l.telefone} />
                <div className="flex items-center gap-2 mt-3">
                  <button onClick={() => setSheet({ mode: "edit", data: l })} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.green }}><Pencil size={12} /> Editar</button>
                  {l.estado !== "Convertido" && (
                    <button onClick={() => setConfirmConvert(l)} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.gold }}><ChevronRight size={12} /> Converter em cliente</button>
                  )}
                  <button onClick={() => setConfirmDel(l)} className="text-xs font-semibold flex items-center gap-1 ml-auto" style={{ color: C.red }}><Trash2 size={12} /></button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <Sheet open={!!sheet} onClose={() => setSheet(null)} title={sheet?.mode === "new" ? "Novo lead" : "Editar lead"}>
        {sheet && <LeadForm data={sheet.data} db={db} onCancel={() => setSheet(null)} onSave={save} />}
      </Sheet>

      <ConfirmDialog open={!!confirmDel} title="Eliminar lead?" body="Esta acção não pode ser desfeita." confirmLabel="Eliminar" danger onCancel={() => setConfirmDel(null)} onConfirm={() => confirmDel && remove(confirmDel.id)} />
      <ConfirmDialog open={!!confirmConvert} title="Converter lead em cliente?" body="Vai criar um novo registo de cliente associado a este lead." confirmLabel="Converter" onCancel={() => setConfirmConvert(null)} onConfirm={() => confirmConvert && convertToClient(confirmConvert)} />
    </div>
  );
}

  const [form, setForm] = useState(data);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  return (
    <form onSubmit={(e) => { e.preventDefault(); onSave(form); }}>
      <Field label="Nome"><TextInput required value={form.nome} onChange={set("nome")} /></Field>
      <Field label="Telefone / WhatsApp"><TextInput required value={form.telefone} onChange={set("telefone")} /></Field>

        </Select>
      </Field>
      <Field label="Observações"><TextArea rows={3} value={form.observacoes} onChange={set("observacoes")} /></Field>
      <div className="flex gap-2 mt-2">
        <GhostButton onClick={onCancel} full>Cancelar</GhostButton>
        <PrimaryButton type="submit" full icon={Check}>Guardar</PrimaryButton>

    </form>

}

/* ======================================================================
   VENDAS  (auto-generates commissions)
====================================================================== */
const SALE_ESTADOS = ["Pendente", "Comprovativo recebido", "Em validação", "Validada", "Reembolsada", "Cancelada"];

function emptySale(campaign) {
  return {
    influencerId: "", clientId: "", campaignId: campaign?.id || "", preco: campaign?.precoPromo || 9900,
    comissaoPct: campaign?.comissaoPct || 50, data: todayISO(), metodoPagamento: "Transferência",
    referencia: "", estado: "Pendente", observacoes: "",
  };
}

function VendasView({ db, setDb, seqRef, persistSeq, flash, accessToken }) {
  const [query, setQuery] = useState("");
  const [sheet, setSheet] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const activeCampaign = db.campaigns.find((c) => c.estado === "Activa") || db.campaigns[0];
  const api = sbTable("sales", accessToken);
  const commissionsApi = sbTable("commissions", accessToken);

  const list = db.sales.filter((s) => {
    const inf = db.influencers.find((i) => i.id === s.influencerId);
    const q = query.toLowerCase();
    return !q || (inf && (inf.nome.toLowerCase().includes(q) || (inf.nomeArtistico || "").toLowerCase().includes(q))) || (s.referencia || "").toLowerCase().includes(q);
  });

  // A comissão é gerada/cancelada automaticamente por um trigger na base de dados
  // quando o estado da venda muda — aqui só precisamos de voltar a buscar as comissões.
  const refetchCommissions = async () => {
    try {
      const rows = await commissionsApi.list();
      setDb((prev) => ({ ...prev, commissions: (rows || []).map(mapIn.commission) }));
    } catch (e) { /* silencioso — a comissão actualiza-se no próximo carregamento */ }
  };

  const deliver = async (sale) => {
    const next = { Pendente: "Autorizado", Autorizado: "Entregue" }[sale.entregaEstado] || "Autorizado";
    try {
      const row = await api.update(sale.id, { entrega_estado: next, entrega_data: next === "Entregue" ? new Date().toISOString() : null });
      const updated = mapIn.sale(row);
      setDb((prev) => ({ ...prev, sales: prev.sales.map((s) => (s.id === sale.id ? updated : s)) }));
      flash(next === "Entregue" ? "Produto entregue" : "Entrega autorizada");
    } catch (e) {
      flash(`Erro: ${e.message}`);
    }
  };

  const save = async (data) => {
    try {
      if (data.id) {
        const row = await api.update(data.id, mapOut.sale(data));
        const updated = mapIn.sale(row);
        setDb((prev) => ({ ...prev, sales: prev.sales.map((s) => (s.id === updated.id ? updated : s)) }));
        flash("Venda actualizada");
      } else {
        const row = await api.insert(mapOut.sale(data));
        const created = mapIn.sale(row);
        setDb((prev) => ({ ...prev, sales: [created, ...prev.sales] }));
        flash("Venda registada");
      }
      setSheet(null);
      await refetchCommissions();
    } catch (e) {
      flash(`Erro ao guardar: ${e.message}`);
    }
  };

  const cancel = async (sale) => {
    try {
      const row = await api.update(sale.id, { estado: "Cancelada" });
      const updated = mapIn.sale(row);
      setDb((prev) => ({ ...prev, sales: prev.sales.map((s) => (s.id === sale.id ? updated : s)) }));
      setConfirmDel(null);
      flash("Venda cancelada");
      await refetchCommissions();
    } catch (e) {
      flash(`Erro ao cancelar: ${e.message}`);
    }
  };

  return (
    <div className="pb-6">
      <ListHeader query={query} setQuery={setQuery} placeholder="Procurar por influencer ou referência…" onAdd={() => setSheet({ mode: "new", data: emptySale(activeCampaign) })} addLabel="Nova venda" />
      {list.length === 0 ? (
        <EmptyState icon={CircleDollarSign} title="Sem vendas" subtitle="Regista uma venda para gerar comissão automaticamente quando for validada." action={<PrimaryButton icon={Plus} onClick={() => setSheet({ mode: "new", data: emptySale(activeCampaign) })}>Nova venda</PrimaryButton>} />
      ) : (
        <div className="grid gap-3">
          {list.map((s) => {
            const inf = db.influencers.find((i) => i.id === s.influencerId);
            const cli = db.clients.find((c) => c.id === s.clientId);
            const prod = (db.products || []).find((p) => p.id === s.productId);
            return (
              <div key={s.id} style={{ background: C.card, borderColor: C.line }} className="rounded-2xl border p-4">
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <p style={{ ...fontDisplay, color: C.ink }} className="font-semibold">{formatKz(s.preco)}</p>
                    <p style={{ color: C.muted }} className="text-xs truncate">{inf ? (inf.nomeArtistico || inf.nome) : "Sem influencer"} {cli ? `· cliente: ${cli.nome}` : ""}</p>
                  </div>
                  <StatusPill status={s.estado} />
                </div>
                <div className="flex items-center gap-3 mt-2 text-xs flex-wrap" style={{ color: C.muted }}>
                  <span>{s.data}</span>
                  <span>{s.metodoPagamento}</span>
                  {s.referencia && <span>Ref: {s.referencia}</span>}
                  {prod && <Pill tone="gold">{prod.nome}</Pill>}
                </div>
                <div className="flex items-center gap-2 mt-3 flex-wrap">
                  <button onClick={() => setSheet({ mode: "edit", data: s })} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.green }}><Pencil size={12} /> Editar</button>
                  {s.estado === "Validada" && prod && s.entregaEstado !== "Entregue" && (
                    <button onClick={() => deliver(s)} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.gold }}><ExternalLink size={12} /> {s.entregaEstado === "Autorizado" ? "Marcar como entregue" : "Autorizar entrega"}</button>
                  )}
                  {s.estado === "Validada" && prod && s.entregaEstado === "Entregue" && (
                    <Pill tone="green">Produto entregue</Pill>
                  )}
                  {!["Cancelada", "Reembolsada"].includes(s.estado) && (
                    <button onClick={() => setConfirmDel(s)} className="text-xs font-semibold flex items-center gap-1 ml-auto" style={{ color: C.red }}><X size={12} /> Cancelar</button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
      <Sheet open={!!sheet} onClose={() => setSheet(null)} title={sheet?.mode === "new" ? "Nova venda" : "Editar venda"} subtitle="Comissão gerada automaticamente ao validar">
        {sheet && <SaleForm data={sheet.data} db={db} onCancel={() => setSheet(null)} onSave={save} />}
      </Sheet>
      <ConfirmDialog open={!!confirmDel} title="Cancelar venda?" body="A comissão associada será automaticamente cancelada. A venda fica registada como Cancelada — não é eliminada, para preservar o histórico." confirmLabel="Cancelar venda" danger onCancel={() => setConfirmDel(null)} onConfirm={() => confirmDel && cancel(confirmDel)} />
    </div>
  );
}

const COMM_ESTADOS = ["Gerada", "Disponível", "Solicitada", "Paga", "Cancelada"];

function ComissoesView({ db, setDb, seqRef, flash, accessToken }) {
  const [filterEstado, setFilterEstado] = useState("Todas");
  const [confirmPay, setConfirmPay] = useState(null);
  const api = sbTable("commissions", accessToken);

  const list = db.commissions.filter((c) => filterEstado === "Todas" || c.estado === filterEstado);

  const advance = async (comm, novoEstado) => {
    try {
      const row = await api.update(comm.id, { estado: novoEstado });
      const updated = mapIn.commission(row);
      setDb((prev) => ({ ...prev, commissions: prev.commissions.map((c) => (c.id === comm.id ? updated : c)) }));
      flash(`Comissão marcada como ${novoEstado}`);
    } catch (e) {
      flash(`Erro: ${e.message}`);
    }
  };

  return (
    <div className="pb-6">
      <div className="flex gap-1.5 overflow-x-auto pb-1 mb-4 no-scrollbar">
        {["Todas", ...COMM_ESTADOS].map((s) => (
          <button
            key={s}
            onClick={() => setFilterEstado(s)}
            style={{ background: filterEstado === s ? C.green : C.card, color: filterEstado === s ? "white" : C.ink, borderColor: C.line }}
            className="border px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap shrink-0"
          >
            {s}
          </button>
        ))}
      </div>

      {list.length === 0 ? (
        <EmptyState icon={Wallet} title="Sem comissões" subtitle="As comissões são geradas automaticamente quando uma venda é validada." />
      ) : (
        <div className="grid gap-3">
          {list.map((c) => {
            const inf = db.influencers.find((i) => i.id === c.influencerId);
            const sale = db.sales.find((s) => s.id === c.saleId);
            return (
              <div key={c.id} style={{ background: C.card, borderColor: C.line }} className="rounded-2xl border p-4">
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <p style={{ ...fontDisplay, color: C.ink }} className="font-bold text-lg">{formatKz(c.valor)}</p>
                    <p style={{ color: C.muted }} className="text-xs">{inf ? (inf.nomeArtistico || inf.nome) : "—"} · venda {c.saleId}</p>
                  </div>
                  <StatusPill status={c.estado} />
                </div>
                {sale && <p style={{ color: C.muted }} className="text-xs mt-1">Preço da venda: {formatKz(sale.preco)} · {sale.comissaoPct}%</p>}
                <div className="flex flex-wrap items-center gap-2 mt-3">
                  {c.estado === "Gerada" && <GhostButton onClick={() => advance(c, "Disponível")}>Marcar disponível</GhostButton>}
                  {c.estado === "Disponível" && <GhostButton onClick={() => advance(c, "Solicitada")}>Marcar solicitada</GhostButton>}
                  {(c.estado === "Disponível" || c.estado === "Solicitada") && (
                    <PrimaryButton icon={Check} onClick={() => setConfirmPay(c)}>Marcar como paga</PrimaryButton>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      <ConfirmDialog
        open={!!confirmPay}
        title="Marcar comissão como paga?"
        body="Esta acção regista o pagamento no histórico da comissão e não pode ser silenciosamente revertida."
        confirmLabel="Confirmar pagamento"
        onCancel={() => setConfirmPay(null)}
        onConfirm={() => { advance(confirmPay, "Paga"); setConfirmPay(null); }}
      />
    </div>
  );
}

const PRODUCT_TIPOS = ["E-book", "Curso", "Mentoria", "Workshop", "Masterclass", "Programa", "Outro"];
const PRODUCT_ESTADOS = ["Draft", "Active", "Paused", "Ended", "Archived"];
const PRODUCT_ESTADO_LABEL = { Draft: "Rascunho", Active: "Activo", Paused: "Pausado", Ended: "Terminado", Archived: "Arquivado" };

function emptyProduct() {
  return {
    nome: "", nomeCurto: "", tipo: "Curso", categoria: "", descricaoCurta: "", descricaoCompleta: "",
    autor: "", capaUrl: "", precoOficial: "", precoPromocional: "", moeda: "Kz", comissaoPct: 50,

function ProductsView({ db, setDb, flash, accessToken }) {
  const [query, setQuery] = useState("");
  const [sheet, setSheet] = useState(null);
  const [detail, setDetail] = useState(null);
  const api = sbTable("products", accessToken);

  const list = (db.products || []).filter((p) => !query || p.nome.toLowerCase().includes(query.toLowerCase()));

  const save = async (data) => {
    try {
      if (data.id) {
        const row = await api.update(data.id, mapOut.product(data));
        const updated = mapIn.product(row);
        setDb((prev) => ({ ...prev, products: prev.products.map((p) => (p.id === updated.id ? updated : p)) }));
        flash("Produto actualizado");
      } else {
        const row = await api.insert(mapOut.product(data));
        const created = mapIn.product(row);
        setDb((prev) => ({ ...prev, products: [created, ...prev.products] }));
        flash("Produto criado");
      }
      setSheet(null);
    } catch (e) {
      flash(`Erro ao guardar: ${e.message}`);
    }
  };

  const archive = async (p) => {
    try {
      const row = await api.update(p.id, { estado: "Archived" });
      const updated = mapIn.product(row);
      setDb((prev) => ({ ...prev, products: prev.products.map((x) => (x.id === p.id ? updated : x)) }));
      flash("Produto arquivado");
    } catch (e) {
      flash(`Erro: ${e.message}`);
    }
  };

  return (
    <div className="pb-6">
      <ListHeader query={query} setQuery={setQuery} placeholder="Procurar produto…" onAdd={() => setSheet({ mode: "new", data: emptyProduct() })} addLabel="Novo produto" />
      {list.length === 0 ? (
        <EmptyState icon={Sparkles} title="Sem produtos" subtitle="Cria o teu primeiro produto — o preço e a comissão ficam disponíveis para ligar às campanhas." action={<PrimaryButton icon={Plus} onClick={() => setSheet({ mode: "new", data: emptyProduct() })}>Novo produto</PrimaryButton>} />
      ) : (
        <div className="grid gap-3">
          {list.map((p) => (
            <div key={p.id} onClick={() => setDetail(p)} style={{ background: C.card, borderColor: C.line }} className="rounded-2xl border p-4 cursor-pointer active:scale-[0.99] transition">
              <div className="flex items-start justify-between gap-2">
                <div className="min-w-0">
                  <p style={{ ...fontDisplay, color: C.ink }} className="font-semibold truncate">{p.nome}</p>
                  <p style={{ color: C.muted }} className="text-xs">{p.tipo} · {p.categoria || "sem categoria"}</p>
                </div>
                <Pill tone={p.estado === "Active" ? "green" : p.estado === "Archived" ? "red" : "gold"}>{PRODUCT_ESTADO_LABEL[p.estado] || p.estado}</Pill>
              </div>
              <div className="flex items-center gap-3 mt-2 text-xs" style={{ color: C.muted }}>
                <span className="line-through opacity-60">{formatKz(p.precoOficial)}</span>
                <span style={{ color: C.green }} className="font-semibold">{formatKz(p.precoPromocional)}</span>
                <span>{p.comissaoPct}% comissão</span>
              </div>
            </div>
          ))}
        </div>
      )}

      <Sheet open={!!sheet} onClose={() => setSheet(null)} title={sheet?.mode === "new" ? "Novo produto" : "Editar produto"}>
        {sheet && <ProductForm data={sheet.data} onCancel={() => setSheet(null)} onSave={save} />}
      </Sheet>

      <Sheet open={!!detail} onClose={() => setDetail(null)} title={detail?.nome} subtitle={detail?.tipo}>
        {detail && (
          <div>
            <Pill tone={detail.estado === "Active" ? "green" : "gold"}>{PRODUCT_ESTADO_LABEL[detail.estado] || detail.estado}</Pill>
            <SectionCard title="Preço e comissão">
              <div className="flex items-center gap-3 text-sm">
                <span className="line-through opacity-60">{formatKz(detail.precoOficial)}</span>
                <span style={{ color: C.green, fontWeight: 700 }}>{formatKz(detail.precoPromocional)}</span>
                <span style={{ color: C.muted }}>· {detail.comissaoPct}% = {formatKz(Math.round(detail.precoPromocional * detail.comissaoPct / 100))}</span>
              </div>
            </SectionCard>
            {detail.headline && (
              <SectionCard title="Comercial">
                <p className="text-sm font-semibold mb-1" style={{ color: C.ink }}>{detail.headline}</p>
                <p className="text-sm" style={{ color: C.muted }}>{detail.promessa}</p>
              </SectionCard>
            )}
            <SectionCard title="Delivery Kit" right={<span style={{ color: C.muted }} className="text-[10px]">mensagens prontas</span>}>
              {[["Mensagem de entrega", detail.mensagemEntrega], ["Mensagem de boas-vindas", detail.mensagemBoasVindas], ["Instruções de entrega", detail.instrucoesEntrega]].map(([label, text]) => text && (
                <div key={label} style={{ borderColor: C.line }} className="border rounded-xl p-3 mb-2">
                  <div className="flex items-center justify-between mb-1">
                    <p style={{ color: C.ink, ...fontBody }} className="text-xs font-bold">{label}</p>
                    <button onClick={() => navigator.clipboard?.writeText(text)} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.green }}><Copy size={12} /> Copiar</button>
                  </div>
                  <p style={{ color: C.muted }} className="text-xs">{text}</p>
                </div>
              ))}
              {!detail.mensagemEntrega && !detail.mensagemBoasVindas && !detail.instrucoesEntrega && (
                <p style={{ color: C.muted }} className="text-xs">Sem mensagens configuradas ainda — edita o produto para as adicionar.</p>
              )}

            <div className="grid grid-cols-2 gap-2 mt-2">

            </div>
          </div>

  );
}

function CampanhasView({ db, setDb, seqRef, persistSeq, flash, accessToken }) {
  const [sheet, setSheet] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const api = sbTable("campaigns", accessToken);

  const save = async (data) => {
    try {
      if (data.id) {
        const row = await api.update(data.id, mapOut.campaign(data));
        const updated = mapIn.campaign(row);
        setDb((prev) => ({ ...prev, campaigns: prev.campaigns.map((c) => (c.id === updated.id ? updated : c)) }));
        flash("Campanha actualizada");
      } else {
        const row = await api.insert(mapOut.campaign(data));
        const created = mapIn.campaign(row);
        setDb((prev) => ({ ...prev, campaigns: [created, ...prev.campaigns] }));
        flash("Campanha criada");
      }
      setSheet(null);
    } catch (e) {
      flash(`Erro ao guardar: ${e.message}`);
    }
  };

  const remove = async (id) => {
    try {
      await api.remove(id);
      setDb((prev) => ({ ...prev, campaigns: prev.campaigns.filter((c) => c.id !== id) }));
      setConfirmDel(null);
      flash("Campanha eliminada");
    } catch (e) {
      flash(`Erro ao eliminar: ${e.message}`);
    }
  };


  return (
    <div className="pb-6">
      <div className="flex justify-end mb-4">
        <button onClick={() => setSheet({ mode: "new", data: emptyCampaign() })} style={{ background: C.green }} className="w-11 h-11 rounded-xl flex items-center justify-center active:scale-95 transition">
          <Plus size={19} color="white" />

      {db.campaigns.length === 0 ? (

function CodigosView({ db, setDb, flash, accessToken }) {
  const [query, setQuery] = useState("");
  const api = sbTable("influencers", accessToken);

  const list = db.influencers.filter((i) => !query || (i.codigo || "").toLowerCase().includes(query.toLowerCase()) || i.nome.toLowerCase().includes(query.toLowerCase()));

  const regenerate = async (inf) => {
    const activeCodes = db.influencers.filter((i) => i.id !== inf.id && i.codigoAtivo).map((i) => i.codigo);
    let novo = randCode(inf.nomeArtistico || inf.nome);
    while (activeCodes.includes(novo)) novo = randCode(inf.nomeArtistico || inf.nome);
    try {
      const row = await api.update(inf.id, { codigo: novo });
      const updated = mapIn.influencer(row);
      setDb((prev) => ({ ...prev, influencers: prev.influencers.map((i) => (i.id === inf.id ? updated : i)) }));
      flash("Código regenerado");
    } catch (e) {
      flash(`Erro: ${e.message}`);
    }
  };

  const toggleActive = async (inf) => {
    try {
      const row = await api.update(inf.id, { codigo_activo: !inf.codigoAtivo });
      const updated = mapIn.influencer(row);
      setDb((prev) => ({ ...prev, influencers: prev.influencers.map((i) => (i.id === inf.id ? updated : i)) }));
      flash(inf.codigoAtivo ? "Código desactivado" : "Código activado");
    } catch (e) {
      flash(`Erro: ${e.message}`);
    }
  };

  return (
    <div className="pb-6">
      <div style={{ background: C.card, borderColor: C.line }} className="border rounded-xl flex items-center px-3 py-2.5 mb-4">
        <Search size={16} style={{ color: C.muted }} />
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Procurar código ou influencer…" style={fontBody} className="flex-1 bg-transparent outline-none text-sm ml-2" />
      </div>

      {list.length === 0 ? (
        <EmptyState icon={KeyRound} title="Sem códigos" subtitle="Os códigos são atribuídos automaticamente ao criar um influencer." />
      ) : (
        <div className="grid gap-3">
          {list.map((inf) => {
            const usos = db.sales.filter((s) => s.influencerId === inf.id).length;
            return (
              <div key={inf.id} style={{ background: C.card, borderColor: C.line }} className="rounded-2xl border p-4">
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <p style={{ ...fontDisplay, color: C.ink }} className="font-bold text-lg tracking-wide">{inf.codigo}</p>
                    <p style={{ color: C.muted }} className="text-xs">{inf.nomeArtistico || inf.nome}</p>
                  </div>
                  <Pill tone={inf.codigoAtivo ? "green" : "red"}>{inf.codigoAtivo ? "Activo" : "Inactivo"}</Pill>
                </div>
                <p style={{ color: C.muted }} className="text-xs mt-2">{usos} utilizações registadas</p>
                <div className="flex items-center gap-2 mt-3">
                  <button onClick={() => navigator.clipboard?.writeText(inf.codigo)} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.green }}><Copy size={12} /> Copiar</button>
                  <button onClick={() => regenerate(inf)} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.gold }}><RefreshCw size={12} /> Regenerar</button>
                  <button onClick={() => toggleActive(inf)} className="text-xs font-semibold flex items-center gap-1 ml-auto" style={{ color: C.red }}>{inf.codigoAtivo ? "Desactivar" : "Activar"}</button>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

====================================================================== */
const PIPELINE_STAGES = ["Prospect", "Contactado", "Respondeu", "Interessado", "Em negociação", "Aprovado", "Onboarding", "Activo"];

function ProspeccaoView({ db, setDb, flash, accessToken }) {
  const [edit, setEdit] = useState(null);
  const api = sbTable("influencers", accessToken);

  const advance = async (inf) => {
    const idx = PIPELINE_STAGES.indexOf(inf.estado);
    if (idx < 0 || idx === PIPELINE_STAGES.length - 1) return;
    const novo = PIPELINE_STAGES[idx + 1];
    try {
      const row = await api.update(inf.id, { estado: novo });
      const updated = mapIn.influencer(row);
      setDb((prev) => ({ ...prev, influencers: prev.influencers.map((i) => (i.id === inf.id ? updated : i)) }));
      flash(`Movido para ${novo}`);
    } catch (e) {
      flash(`Erro: ${e.message}`);
    }
  };

  const saveQuick = async (data) => {
    try {
      const row = await api.update(data.id, {
        proxima_accao: data.proximaAcao, data_proximo_contacto: data.dataProximoContacto || null,
        ultimo_contacto: data.ultimoContacto || null, canal: data.canal, observacoes: data.observacoes,
      });
      const updated = mapIn.influencer(row);
      setDb((prev) => ({ ...prev, influencers: prev.influencers.map((i) => (i.id === data.id ? updated : i)) }));
      setEdit(null);
      flash("Prospecção actualizada");
    } catch (e) {
      flash(`Erro: ${e.message}`);
    }
  };

  return (
    <div className="pb-6">
      <p style={{ color: C.muted, ...fontBody }} className="text-xs mb-3">Arrasta a conversa manualmente — toca em "Avançar" para mover um influencer para a fase seguinte.</p>
      <div className="flex gap-3 overflow-x-auto pb-2 -mx-4 px-4 no-scrollbar">
        {PIPELINE_STAGES.map((stage) => {
          const items = db.influencers.filter((i) => i.estado === stage);
          return (
            <div key={stage} style={{ background: "#F1F0EC" }} className="rounded-2xl p-2.5 w-60 shrink-0">
              <div className="flex items-center justify-between px-1 mb-2">
                <p style={{ ...fontDisplay, color: C.ink }} className="text-xs font-bold">{stage}</p>
                <Pill>{items.length}</Pill>
              </div>
              <div className="flex flex-col gap-2">
                {items.map((inf) => (
                  <div key={inf.id} onClick={() => setEdit(inf)} style={{ background: C.card, borderColor: C.line }} className="border rounded-xl p-3 cursor-pointer active:scale-[0.98] transition">
                    <p style={{ color: C.ink, ...fontBody }} className="text-sm font-semibold truncate">{inf.nomeArtistico || inf.nome}</p>
                    <p style={{ color: C.muted }} className="text-[11px] truncate">{inf.proximaAcao || "Sem próxima acção definida"}</p>
                    {inf.dataProximoContacto && <p style={{ color: C.gold }} className="text-[10px] font-semibold mt-1">Próx: {inf.dataProximoContacto}</p>}
                    {stage !== "Activo" && (
                      <button onClick={(e) => { e.stopPropagation(); advance(inf); }} className="text-[11px] font-semibold flex items-center gap-1 mt-2" style={{ color: C.green }}>
                        Avançar <ChevronRight size={12} />
                      </button>
                    )}
                  </div>
                ))}
                {items.length === 0 && <p style={{ color: C.muted }} className="text-[11px] text-center py-4">Vazio</p>}
              </div>
            </div>
          );
        })}
      </div>

      <Sheet open={!!edit} onClose={() => setEdit(null)} title={edit?.nomeArtistico || edit?.nome} subtitle="Prospecção">
        {edit && <ProspectionQuickForm data={edit} onCancel={() => setEdit(null)} onSave={saveQuick} />}
      </Sheet>
    </div>
  );
}

function FollowUpsView({ db, setDb, flash, accessToken }) {
  const api = sbTable("leads", accessToken);
  const [stageFilter, setStageFilter] = useState("Todos");

    .map((l) => ({ ...l, __fu: computeFollowUp(l) }))

    .filter((l) => stageFilter === "Todos" || String(l.__fu.stage) === stageFilter)
    .sort((a, b) => b.__fu.days - a.__fu.days);

  const markSent = async (lead) => {
    try {
      const row = await api.update(lead.id, { ultimo_contacto: todayISO() });
      const updated = mapIn.lead(row);
      setDb((prev) => ({ ...prev, leads: prev.leads.map((l) => (l.id === lead.id ? updated : l)) }));
      flash("Follow-up marcado como enviado");

      flash(`Erro: ${e.message}`);

    <div className="pb-6">

        <EmptyState icon={Clock} title="Sem follow-ups pendentes" subtitle="Todos os leads activos foram contactados recentemente." />
      ) : (
        <div className="grid gap-3">
          {due.map((l) => {
            const inf = db.influencers.find((i) => i.id === l.influencerId);

        setDb((prev) => ({ ...prev, diagnostics: prev.diagnostics.map((d) => (d.id === updated.id ? updated : d)) }));

function PagamentosView({ db, setDb, seqRef, persistSeq, flash, accessToken }) {
  const [sheet, setSheet] = useState(null);
  const api = sbTable("commission_payments", accessToken);
  const commissionsApi = sbTable("commissions", accessToken);

  const markPago = async (pg) => {
    try {
      const row = await api.update(pg.id, { estado: "Pago", data: todayISO() });
      const updated = mapIn.payment(row);
      await Promise.all(pg.commissionIds.map((cid) => commissionsApi.update(cid, { estado: "Paga" })));
      setDb((prev) => ({
        ...prev,
        payments: prev.payments.map((p) => (p.id === pg.id ? { ...updated, commissionIds: pg.commissionIds } : p)),
        commissions: prev.commissions.map((c) => (pg.commissionIds.includes(c.id) ? { ...c, estado: "Paga" } : c)),
      }));
      flash("Pagamento marcado como pago");
    } catch (e) {
      flash(`Erro: ${e.message}`);
    }
  };

  const create = async (data) => {
    try {
      const row = await api.insert(mapOut.payment(data));
      const created = mapIn.payment(row);
      // regista a ligação entre o pagamento e cada comissão incluída
      await Promise.all(
        data.commissionIds.map((cid) =>
          sbFetch(`/rest/v1/commission_payment_items`, { method: "POST", body: { payment_id: created.id, commission_id: cid }, accessToken })
        )
      );
      setDb((prev) => ({ ...prev, payments: [{ ...created, commissionIds: data.commissionIds }, ...prev.payments] }));
      flash("Pagamento criado");
      setSheet(null);
    } catch (e) {
      flash(`Erro ao criar pagamento: ${e.message}`);
    }
  };

  return (
    <div className="pb-6">
      <div className="flex justify-end mb-4">
        <button onClick={() => setSheet(true)} style={{ background: C.green }} className="w-11 h-11 rounded-xl flex items-center justify-center active:scale-95 transition">
          <Plus size={19} color="white" />
        </button>
      </div>
      {db.payments.length === 0 ? (
        <EmptyState icon={Landmark} title="Sem pagamentos" subtitle="Agrupa comissões disponíveis num lote de pagamento por influencer." action={<PrimaryButton icon={Plus} onClick={() => setSheet(true)}>Novo pagamento</PrimaryButton>} />
      ) : (
        <div className="grid gap-3">
          {db.payments.map((pg) => {
            const inf = db.influencers.find((i) => i.id === pg.influencerId);
            return (
              <div key={pg.id} style={{ background: C.card, borderColor: C.line }} className="rounded-2xl border p-4">
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <p style={{ ...fontDisplay, color: C.ink }} className="font-bold text-lg">{formatKz(pg.valor)}</p>
                    <p style={{ color: C.muted }} className="text-xs">{inf ? (inf.nomeArtistico || inf.nome) : "—"} · {pg.commissionIds.length} comissões</p>
                  </div>
                  <StatusPill status={pg.estado} />
                </div>
                <p style={{ color: C.muted }} className="text-xs mt-1">{pg.metodo} · {pg.periodo}</p>
                {pg.estado !== "Pago" && <div className="mt-3"><PrimaryButton icon={Check} onClick={() => markPago(pg)}>Marcar como pago</PrimaryButton></div>}
              </div>
            );
          })}
        </div>
      )}
      <Sheet open={!!sheet} onClose={() => setSheet(null)} title="Novo pagamento">
        {sheet && <PaymentForm db={db} onCancel={() => setSheet(null)} onSave={create} />}
      </Sheet>
    </div>
  );
}

function PaymentForm({ db, onCancel, onSave }) {
  const [influencerId, setInfluencerId] = useState("");
  const [selected, setSelected] = useState([]);
  const [metodo, setMetodo] = useState("Transferência");
  const available = db.commissions.filter((c) => c.influencerId === influencerId && c.estado === "Disponível");
  const total = available.filter((c) => selected.includes(c.id)).reduce((s, c) => s + Number(c.valor), 0);

  return (
    <form onSubmit={(e) => {
      e.preventDefault();
      if (!influencerId || selected.length === 0) return;
      onSave({ influencerId, commissionIds: selected, valor: total, periodo: `${daysAgo(30)} a ${todayISO()}`, metodo, conta: "—", referencia: `PAG-${Math.floor(Math.random() * 9000 + 1000)}`, administrador: "Admin", observacoes: "" });
    }}>
      <Field label="Influencer">
        <Select required value={influencerId} onChange={(e) => { setInfluencerId(e.target.value); setSelected([]); }}>
          <option value="">Seleccionar…</option>
          {db.influencers.map((i) => <option key={i.id} value={i.id}>{i.nomeArtistico || i.nome}</option>)}
        </Select>

      {influencerId && (
        <Field label="Comissões disponíveis">
          {available.length === 0 ? (
            <p style={{ color: C.muted }} className="text-sm">Sem comissões disponíveis para este influencer.</p>

            <div className="flex flex-col gap-2">
              {available.map((c) => (
                <label key={c.id} style={{ borderColor: C.line }} className="border rounded-xl p-3 flex items-center justify-between text-sm">
                  <span>{c.id} · {formatKz(c.valor)}</span>
                  <input type="checkbox" checked={selected.includes(c.id)} onChange={() => setSelected((s) => (s.includes(c.id) ? s.filter((x) => x !== c.id) : [...s, c.id]))} />
                </label>
              ))}

        <Select value={metodo} onChange={(e) => setMetodo(e.target.value)}>

      </Field>
      <div style={{ background: C.greenTint }} className="rounded-xl p-3 flex items-center justify-between mb-4">
        <span style={{ color: C.green, ...fontBody }} className="text-xs font-semibold">Total seleccionado</span>
        <span style={{ ...fontDisplay, color: C.green }} className="font-bold">{formatKz(total)}</span>
      </div>
      <div className="flex gap-2 mt-2">
        <GhostButton onClick={onCancel} full>Cancelar</GhostButton>
        <PrimaryButton type="submit" full icon={Check}>Criar pagamento</PrimaryButton>
      </div>
    </form>
  );
}

const SCRIPT_CATEGORIAS = [
  "Primeiro contacto", "Instagram DM", "WhatsApp", "Email outreach", "LinkedIn", "Follow-up",
  "Influencer interessado", "Apresentação da parceria", "Objeção sobre comissão", "Objeção sobre produto",

  "Scripts para TikTok", "Scripts de prova social", "Scripts de lançamento", "Partnership proposal", "Negotiation",
];

function emptyScript() {
  return { titulo: "", categoria: SCRIPT_CATEGORIAS[0], objectivo: "", plataforma: "WhatsApp", publico: "", idioma: "PT", variante: "curta", texto: "", cta: "", variaveis: "", notas: "", estado: "Activo" };
}

function ScriptsView({ db, setDb, seqRef, persistSeq, flash, accessToken }) {
  const [query, setQuery] = useState("");
  const [categoria, setCategoria] = useState("Todas");
  const [sheet, setSheet] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const api = sbTable("scripts", accessToken);

  const list = db.scripts.filter((s) => {
    const q = query.toLowerCase();
    const matchQ = !q || s.titulo.toLowerCase().includes(q) || s.texto.toLowerCase().includes(q);
    const matchCat = categoria === "Todas" || s.categoria === categoria;
    return matchQ && matchCat;
  });

  const save = async (data) => {
    try {
      if (data.id) {
        const row = await api.update(data.id, mapOut.script(data));
        const updated = mapIn.script(row);
        setDb((prev) => ({ ...prev, scripts: prev.scripts.map((s) => (s.id === updated.id ? updated : s)) }));
        flash("Script actualizado");
      } else {
        const row = await api.insert(mapOut.script(data));
        const created = mapIn.script(row);
        setDb((prev) => ({ ...prev, scripts: [created, ...prev.scripts] }));
        flash("Script criado");
      }
      setSheet(null);
    } catch (e) {
      flash(`Erro ao guardar: ${e.message}`);
    }
  };

  const duplicate = async (s) => {
    try {
      const row = await api.insert(mapOut.script({ ...s, titulo: s.titulo + " (cópia)" }));
      const created = mapIn.script(row);
      setDb((prev) => ({ ...prev, scripts: [created, ...prev.scripts] }));
      flash("Script duplicado");
    } catch (e) {
      flash(`Erro: ${e.message}`);
    }
  };

  const remove = async (id) => {
    try {
      await api.remove(id);
      setDb((prev) => ({ ...prev, scripts: prev.scripts.filter((s) => s.id !== id) }));
      setConfirmDel(null);
      flash("Script eliminado");
    } catch (e) {
      flash(`Erro ao eliminar: ${e.message}`);
    }
  };

  return (
    <div className="pb-6">
      <ListHeader query={query} setQuery={setQuery} placeholder="Procurar script…" onAdd={() => setSheet({ mode: "new", data: emptyScript() })} addLabel="Novo script" />
      <div className="flex gap-1.5 overflow-x-auto pb-1 mb-4 no-scrollbar">
        {["Todas", ...SCRIPT_CATEGORIAS].map((c) => (
          <button key={c} onClick={() => setCategoria(c)} style={{ background: categoria === c ? C.green : C.card, color: categoria === c ? "white" : C.ink, borderColor: C.line }} className="border px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap shrink-0">
            {c}
          </button>
        ))}
      </div>
      {list.length === 0 ? (
        <EmptyState icon={FileText} title="Sem scripts" subtitle="Cria a tua biblioteca de scripts para abordagem, objeções e fecho." action={<PrimaryButton icon={Plus} onClick={() => setSheet({ mode: "new", data: emptyScript() })}>Novo script</PrimaryButton>} />
      ) : (
        <div className="grid gap-3">
          {list.map((s) => (
            <div key={s.id} style={{ background: C.card, borderColor: C.line }} className="rounded-2xl border p-4">
              <div className="flex items-start justify-between gap-2">
                <div className="min-w-0">
                  <p style={{ ...fontDisplay, color: C.ink }} className="font-semibold truncate">{s.titulo}</p>
                  <p style={{ color: C.muted }} className="text-xs">{s.categoria} · {s.plataforma} · {s.idioma} · {s.variante}</p>
                </div>
              </div>
              <p style={{ color: C.ink }} className="text-sm mt-2 line-clamp-3">{s.texto}</p>
              <div className="flex items-center gap-2 mt-3 flex-wrap">
                <button onClick={() => navigator.clipboard?.writeText(s.texto)} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.green }}><Copy size={12} /> Copiar</button>
                <button onClick={() => setSheet({ mode: "edit", data: s })} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.green }}><Pencil size={12} /> Editar</button>
                <button onClick={() => duplicate(s)} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.gold }}><Copy size={12} /> Duplicar</button>
                <button onClick={() => setConfirmDel(s)} className="text-xs font-semibold flex items-center gap-1 ml-auto" style={{ color: C.red }}><Trash2 size={12} /></button>
              </div>
            </div>
          ))}
        </div>
      )}
      <Sheet open={!!sheet} onClose={() => setSheet(null)} title={sheet?.mode === "new" ? "Novo script" : "Editar script"}>
        {sheet && <ScriptForm data={sheet.data} onCancel={() => setSheet(null)} onSave={save} />}
      </Sheet>
      <ConfirmDialog open={!!confirmDel} title="Eliminar script?" body="Esta acção não pode ser desfeita." confirmLabel="Eliminar" danger onCancel={() => setConfirmDel(null)} onConfirm={() => confirmDel && remove(confirmDel.id)} />
    </div>
  );
}

/* ======================================================================
   RANKING
====================================================================== */
function RankingView({ db }) {
  const [period, setPeriod] = useState("30 dias");

  const rows = useMemo(() => {
    return db.influencers.map((inf) => {
      const salesP = db.sales.filter((s) => s.influencerId === inf.id && withinPeriod(s.data, period));
      const validated = salesP.filter((s) => s.estado === "Validada");
      const leadsP = db.leads.filter((l) => l.influencerId === inf.id && withinPeriod(l.dataEntrada, period));
      const receita = validated.reduce((s, x) => s + Number(x.preco), 0);
      const comissao = db.commissions.filter((c) => c.influencerId === inf.id && validated.some((s) => s.id === c.saleId)).reduce((s, c) => s + Number(c.valor), 0);
      const conversao = leadsP.length ? Math.round((validated.length / leadsP.length) * 100) : 0;
      return { inf, vendas: validated.length, receita, comissao, leads: leadsP.length, conversao };
    }).sort((a, b) => b.vendas - a.vendas || b.receita - a.receita);
  }, [db, period]);

  const medals = ["🥇", "🥈", "🥉"];

  return (
    <div className="pb-6">
      <PeriodFilter value={period} onChange={setPeriod} />
      <div className="grid gap-3 mt-4">
        {rows.map((r, idx) => (
          <div key={r.inf.id} style={{ background: C.card, borderColor: C.line }} className="rounded-2xl border p-4 flex items-center gap-3">
            <div style={{ background: idx < 3 ? C.greenTint : "#F1F0EC" }} className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0">
              {idx < 3 ? <span className="text-lg">{medals[idx]}</span> : <span style={{ color: C.muted, ...fontBody }} className="text-sm font-bold">{idx + 1}</span>}
            </div>
            <div className="flex-1 min-w-0">
              <p style={{ ...fontDisplay, color: C.ink }} className="font-semibold truncate">{r.inf.nomeArtistico || r.inf.nome}</p>
              <p style={{ color: C.muted }} className="text-xs">{r.vendas} vendas · {formatKz(r.receita)} · {r.conversao}% conversão</p>
            </div>
            <p style={{ ...fontDisplay, color: C.green }} className="font-bold text-sm shrink-0">{formatKz(r.comissao)}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

====================================================================== */
function Desafio30View({ db, setDb, flash, accessToken }) {
  const [open, setOpen] = useState(null);
  const inAcompanhamento = db.clients.filter((c) => c.estado === "Em acompanhamento" || c.estado === "Concluído");
  const api = sbTable("clients", accessToken);

  const markDay = async (client, day) => {
    const novoDia = Math.max(client.diaAcompanhamento, day);
    const concluido = novoDia >= 30;
    try {
      const row = await api.update(client.id, { dia_acompanhamento: novoDia, estado: concluido ? "Concluído" : client.estado });
      const updated = mapIn.client(row);
      setDb((prev) => ({ ...prev, clients: prev.clients.map((c) => (c.id === client.id ? updated : c)) }));
      setOpen(updated);
      flash(concluido ? "Desafio concluído! 🎉" : `Dia ${novoDia} marcado`);
    } catch (e) {
      flash(`Erro: ${e.message}`);
    }
  };

  return (
    <div className="pb-6">
      {inAcompanhamento.length === 0 ? (
        <EmptyState icon={Rocket} title="Sem clientes em desafio" subtitle="Os clientes aparecem aqui quando entram em acompanhamento de 30 dias." />
      ) : (
        <div className="grid gap-3">
          {inAcompanhamento.map((c) => (
            <div key={c.id} onClick={() => setOpen(c)} style={{ background: C.card, borderColor: C.line }} className="rounded-2xl border p-4 cursor-pointer">
              <div className="flex items-start justify-between gap-2">
                <p style={{ ...fontDisplay, color: C.ink }} className="font-semibold">{c.nome}</p>
                <Pill tone={c.estado === "Concluído" ? "green" : "gold"}>Dia {c.diaAcompanhamento}/30</Pill>
              </div>
              <div style={{ background: "#F1F0EC" }} className="h-2 rounded-full overflow-hidden mt-3">
                <div style={{ background: C.gold, width: `${Math.min(100, (c.diaAcompanhamento / 30) * 100)}%` }} className="h-full rounded-full" />
              </div>
              <p style={{ color: C.muted }} className="text-xs mt-1.5">{Math.round((c.diaAcompanhamento / 30) * 100)}% concluído</p>
            </div>
          ))}
        </div>
      )}

      <Sheet open={!!open} onClose={() => setOpen(null)} title={open?.nome} subtitle="Desafio 30 Dias">
        {open && (
          <div className="grid grid-cols-5 gap-2">
            {Array.from({ length: 30 }).map((_, i) => {
              const day = i + 1;
              const done = day <= open.diaAcompanhamento;
              return (
                <button
                  key={day}
                  onClick={() => markDay(open, day)}
                  style={{ background: done ? C.green : "#F1F0EC", color: done ? "white" : C.ink }}
                  className="aspect-square rounded-xl flex items-center justify-center text-xs font-bold"
                >
                  {done ? <Check size={13} /> : day}
                </button>
              );
            })}
          </div>
        )}
      </Sheet>
    </div>
  );
}

====================================================================== */
function emptyTask() { return { titulo: "", descricao: "", responsavel: "Admin", prioridade: "Média", prazo: todayISO(), estado: "Pendente", entidade: "" }; }
const TASK_TONE = { Alta: "red", Média: "gold", Baixa: "neutral" };

function TarefasView({ db, setDb, seqRef, persistSeq, flash, accessToken, userId }) {
  const [sheet, setSheet] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [filter, setFilter] = useState("Pendente");
  const api = sbTable("tasks", accessToken);

  const list = db.tasks.filter((t) => filter === "Todas" || t.estado === filter).sort((a, b) => new Date(a.prazo) - new Date(b.prazo));

  const save = async (data) => {
    try {
      if (data.id) {
        const row = await api.update(data.id, mapOut.task(data, userId));
        const updated = mapIn.task(row);
        setDb((prev) => ({ ...prev, tasks: prev.tasks.map((t) => (t.id === updated.id ? { ...updated, entidade: data.entidade } : t)) }));
        flash("Tarefa actualizada");
      } else {
        const row = await api.insert(mapOut.task(data, userId));
        const created = mapIn.task(row);
        setDb((prev) => ({ ...prev, tasks: [{ ...created, entidade: data.entidade }, ...prev.tasks] }));
        flash("Tarefa criada");
      }
      setSheet(null);
    } catch (e) {
      flash(`Erro ao guardar: ${e.message}`);
    }
  };
  const toggleDone = async (t) => {
    const novoEstado = t.estado === "Concluída" ? "Pendente" : "Concluída";
    try {
      await api.update(t.id, { estado: novoEstado });
      setDb((prev) => ({ ...prev, tasks: prev.tasks.map((x) => (x.id === t.id ? { ...x, estado: novoEstado } : x)) }));
    } catch (e) {
      flash(`Erro: ${e.message}`);
    }
  };
  const remove = async (id) => {
    try {
      await api.remove(id);
      setDb((prev) => ({ ...prev, tasks: prev.tasks.filter((t) => t.id !== id) }));
      setConfirmDel(null);
      flash("Tarefa eliminada");
    } catch (e) {
      flash(`Erro ao eliminar: ${e.message}`);
    }
  };

  return (
    <div className="pb-6">
      <div className="flex items-center justify-between mb-4">
        <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
          {["Pendente", "Concluída", "Todas"].map((f) => (
            <button key={f} onClick={() => setFilter(f)} style={{ background: filter === f ? C.green : C.card, color: filter === f ? "white" : C.ink, borderColor: C.line }} className="border px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap shrink-0">
              {f}
            </button>
          ))}
        </div>
        <button onClick={() => setSheet({ mode: "new", data: emptyTask() })} style={{ background: C.green }} className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ml-2">
          <Plus size={17} color="white" />
        </button>
      </div>
      {list.length === 0 ? (
        <EmptyState icon={ListChecks} title="Sem tarefas" subtitle="Cria tarefas para acompanhar follow-ups, validações e pagamentos." />
      ) : (
        <div className="grid gap-3">
          {list.map((t) => (
            <div key={t.id} style={{ background: C.card, borderColor: C.line }} className="rounded-2xl border p-4">
              <div className="flex items-start gap-3">
                <button onClick={() => toggleDone(t)} style={{ borderColor: t.estado === "Concluída" ? C.green : C.line, background: t.estado === "Concluída" ? C.green : "transparent" }} className="w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 mt-0.5">
                  {t.estado === "Concluída" && <Check size={13} color="white" />}
                </button>
                <div className="min-w-0 flex-1">
                  <p style={{ ...fontDisplay, color: C.ink, textDecoration: t.estado === "Concluída" ? "line-through" : "none" }} className="font-semibold text-sm">{t.titulo}</p>
                  {t.descricao && <p style={{ color: C.muted }} className="text-xs mt-0.5">{t.descricao}</p>}
                  <div className="flex items-center gap-2 mt-2">
                    <Pill tone={TASK_TONE[t.prioridade]}>{t.prioridade}</Pill>
                    <span style={{ color: C.muted }} className="text-[11px]">{t.prazo}</span>
                  </div>
                </div>
              </div>
              <div className="flex items-center gap-2 mt-2 pl-9">
                <button onClick={() => setSheet({ mode: "edit", data: t })} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.green }}><Pencil size={12} /> Editar</button>
                <button onClick={() => setConfirmDel(t)} className="text-xs font-semibold flex items-center gap-1 ml-auto" style={{ color: C.red }}><Trash2 size={12} /></button>
              </div>
            </div>
          ))}
        </div>
      )}
      <Sheet open={!!sheet} onClose={() => setSheet(null)} title={sheet?.mode === "new" ? "Nova tarefa" : "Editar tarefa"}>
        {sheet && <TaskForm data={sheet.data} onCancel={() => setSheet(null)} onSave={save} />}
      </Sheet>
      <ConfirmDialog open={!!confirmDel} title="Eliminar tarefa?" body="Esta acção não pode ser desfeita." confirmLabel="Eliminar" danger onCancel={() => setConfirmDel(null)} onConfirm={() => confirmDel && remove(confirmDel.id)} />
    </div>
  );
}

/* ======================================================================
   RELATÓRIO EXECUTIVO
====================================================================== */
function RelatorioExecutivoView({ db }) {
  const [period, setPeriod] = useState("Este mês");
  const sales = db.sales.filter((s) => withinPeriod(s.data, period));
  const validated = sales.filter((s) => s.estado === "Validada");
  const receita = validated.reduce((s, x) => s + Number(x.preco), 0);
  const comissoes = db.commissions.filter((c) => validated.some((s) => s.id === c.saleId)).reduce((s, c) => s + Number(c.valor), 0);
  const receitaLiquida = receita - comissoes;
  const ticketMedio = validated.length ? Math.round(receita / validated.length) : 0;
  const leadsP = db.leads.filter((l) => withinPeriod(l.dataEntrada, period));
  const conversao = leadsP.length ? Math.round((validated.length / leadsP.length) * 100) : 0;

  const porInfluencer = db.influencers.map((inf) => ({ inf, vendas: validated.filter((s) => s.influencerId === inf.id).length }));
  const melhorInfluencer = porInfluencer.sort((a, b) => b.vendas - a.vendas)[0];
  const porCampanha = db.campaigns.map((c) => ({ c, vendas: validated.filter((s) => s.campaignId === c.id).length }));
  const melhorCampanha = porCampanha.sort((a, b) => b.vendas - a.vendas)[0];

  const rows = [
    ["Receita total", formatKz(receita)],
    ["Comissões", formatKz(comissoes)],
    ["Receita líquida (antes de outros custos)", formatKz(receitaLiquida)],
    ["Número de parceiros", db.influencers.length],
    ["Número de clientes", db.clients.length],
    ["Número de vendas validadas", validated.length],
    ["Ticket médio", formatKz(ticketMedio)],
    ["Conversão leads → venda", `${conversao}%`],
    ["Melhor influencer", melhorInfluencer?.vendas ? `${melhorInfluencer.inf.nomeArtistico || melhorInfluencer.inf.nome} (${melhorInfluencer.vendas} vendas)` : "—"],
    ["Melhor campanha", melhorCampanha?.vendas ? `${melhorCampanha.c.nome} (${melhorCampanha.vendas} vendas)` : "—"],
  ];

  return (
    <div className="pb-6">
      <PeriodFilter value={period} onChange={setPeriod} />
      <SectionCard title={`Relatório executivo · ${period}`}>
        <div className="divide-y" style={{ borderColor: C.line }}>
          {rows.map(([label, value]) => (
            <div key={label} className="flex items-center justify-between py-2.5">
              <span style={{ color: C.muted, ...fontBody }} className="text-sm">{label}</span>
              <span style={{ ...fontDisplay, color: C.ink }} className="font-semibold text-sm text-right">{value}</span>
            </div>
          ))}
        </div>
      </SectionCard>
    </div>
  );
}

/* ======================================================================
   NOTIFICAÇÕES (computadas dinamicamente)
====================================================================== */
function computeNotifications(db) {
  const notifs = [];
  db.sales.filter((s) => s.estado === "Comprovativo recebido" || s.estado === "Em validação").forEach((s) =>
    notifs.push({ id: `n-sale-${s.id}`, tipo: "Comprovativo pendente", texto: `Venda ${s.id} aguarda validação`, view: "vendas", icon: AlertTriangle, tone: "gold" })
  );
  db.commissions.filter((c) => c.estado === "Disponível").forEach((c) =>
    notifs.push({ id: `n-comm-${c.id}`, tipo: "Comissão disponível", texto: `Comissão ${c.id} pronta para pagamento`, view: "comissoes", icon: Wallet, tone: "green" })
  );
  db.clients.filter((c) => c.estado === "Em acompanhamento" && c.diaAcompanhamento >= 27 && c.diaAcompanhamento < 30).forEach((c) =>
    notifs.push({ id: `n-cli-${c.id}`, tipo: "Cliente perto do Dia 30", texto: `${c.nome} está no dia ${c.diaAcompanhamento}/30`, view: "desafio30", icon: Rocket, tone: "gold" })
  );
  db.influencers.filter((i) => PIPELINE_STAGES.includes(i.estado) && i.dataProximoContacto && i.dataProximoContacto < todayISO()).forEach((i) =>
    notifs.push({ id: `n-inf-${i.id}`, tipo: "Follow-up vencido", texto: `${i.nomeArtistico || i.nome} — follow-up em atraso`, view: "prospeccao", icon: Clock, tone: "red" })
  );
  db.campaigns.filter((c) => c.estado === "Activa" && c.dataFim && c.dataFim < daysAgo(-7) && c.dataFim >= todayISO()).forEach((c) =>
    notifs.push({ id: `n-cmp-${c.id}`, tipo: "Campanha a terminar", texto: `${c.nome} termina em breve`, view: "campanhas", icon: CalendarClock, tone: "gold" })
  );
  db.socialProofs.filter((s) => s.estado === "Aguardando autorização").forEach((s) =>
    notifs.push({ id: `n-sp-${s.id}`, tipo: "Prova social por autorizar", texto: `Aguarda autorização para publicação`, view: "vip", icon: ThumbsUp, tone: "neutral" })
  );
  return notifs;
}

function NotificacoesView({ db, setView }) {
