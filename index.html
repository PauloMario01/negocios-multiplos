<script>
  // Compatibilidade: fora do Claude, window.storage não existe — usa localStorage no seu lugar.
  if (!window.storage) {
    window.storage = {
      get: async (key) => {
        const v = localStorage.getItem(key);
        return v !== null ? { key, value: v, shared: false } : null;
      },
      set: async (key, value) => {
        localStorage.setItem(key, value);
        return { key, value, shared: false };
      },
      delete: async (key) => {
        localStorage.removeItem(key);
        return { key, deleted: true, shared: false };
      },
      list: async (prefix) => {
        const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
        return { keys, prefix, shared: false };
      },
    };
  }
</script>

<script>
  // DIAGNÓSTICO: mostra qualquer erro directamente no ecrã, em vez de ficar em branco.
  window.__nmosErrors = [];
  function __nmosShowError(msg) {
    window.__nmosErrors.push(msg);
    var root = document.getElementById("root");
    if (!root) return;
    if (!root.dataset.nmosErrorBox) {
      root.dataset.nmosErrorBox = "1";
      root.innerHTML = '<div style="padding:20px;font-family:sans-serif;background:#FBEAE3;color:#7A1F0A;white-space:pre-wrap;line-height:1.5;font-size:14px;"><b>Erro ao carregar a app — mostra isto ao Claude:</b><br><br><div id="nmos-error-list"></div></div>';
    }
    var list = document.getElementById("nmos-error-list");
    if (list) {
      var line = document.createElement("div");
      line.style.marginBottom = "10px";
      line.style.paddingBottom = "10px";
      line.style.borderBottom = "1px solid #e8c4b8";
      line.textContent = msg;
      list.appendChild(line);
    }
  }
  window.addEventListener("error", function (e) {
    var msg = e.message || "Script error.";
    if (e.filename) msg += "\n  em: " + e.filename + (e.lineno ? (":" + e.lineno) : "");
    __nmosShowError(msg);
  });
  window.addEventListener("unhandledrejection", function (e) {
    var reason = e.reason;
    var msg = (reason && (reason.stack || reason.message)) ? (reason.message || String(reason)) : String(reason);
    __nmosShowError("Promise rejeitada: " + msg);
  });
  // Se ao fim de 10s nada tiver renderizado nem erro nenhum aparecido, avisa também.
  setTimeout(function () {
    var root = document.getElementById("root");
    if (root && !root.dataset.nmosErrorBox && root.textContent.indexOf("A carregar") !== -1) {
      __nmosShowError("Nada carregou em 10 segundos e não foi apanhado nenhum erro de JavaScript. Provável causa: um dos scripts externos (unpkg.com ou esm.sh) não conseguiu carregar nesta rede — tenta trocar de WiFi para dados móveis (ou vice-versa) e recarregar.");
    }
  }, 10000);
</script>

async function sbFetch(path, { method = "GET", body, accessToken, prefer } = {}) {
  const res = await fetch(`${SUPABASE_URL}${path}`, {
    method,
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${accessToken || SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      ...(prefer ? { Prefer: prefer } : {}),
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let msg = `${res.status}`;
    try { const j = await res.json(); msg = j.message || j.msg || msg; } catch (e) {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function sbLogin(email, password) {

// CRUD genérico para uma tabela Supabase
function sbTable(name, accessToken) {
  return {
    list: () => sbFetch(`/rest/v1/${name}?select=*&order=created_at.desc`, { accessToken }),
    insert: (row) => sbFetch(`/rest/v1/${name}`, { method: "POST", body: row, accessToken, prefer: "return=representation" }).then((r) => r[0]),
    update: (id, patch) => sbFetch(`/rest/v1/${name}?id=eq.${id}`, { method: "PATCH", body: patch, accessToken, prefer: "return=representation" }).then((r) => r[0]),
    remove: (id) => sbFetch(`/rest/v1/${name}?id=eq.${id}`, { method: "DELETE", accessToken }),
  };
}

function bankingApi(accessToken) {
  return {
    get: (influencerId) => sbFetch(`/rest/v1/influencer_banking?influencer_id=eq.${influencerId}&select=*`, { accessToken }).then((r) => mapIn.banking(r?.[0])),
    upsert: (influencerId, data) =>
      sbFetch(`/rest/v1/influencer_banking`, {
        method: "POST",
        body: { influencer_id: influencerId, ...mapOut.banking(data) },
        accessToken,
        prefer: "resolution=merge-duplicates,return=representation",
      }).then((r) => mapIn.banking(r?.[0])),
  };
}

function genId(prefix, seqRef) {
  seqRef.current += 1;
  return `${prefix}${String(seqRef.current).padStart(4, "0")}`;
}

function formatKz(n) {
  const v = Number(n) || 0;
  return v.toLocaleString("pt-PT", { maximumFractionDigits: 0 }) + " Kz";
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function daysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.toISOString().slice(0, 10);
}

function pushAudit(setDb, seqRef, { utilizador = "Admin", accao, entidade, entidadeId }) {
  seqRef.current.AUD = (seqRef.current.AUD || 0) + 1;
  const id = `AUD${String(seqRef.current.AUD).padStart(4, "0")}`;
  setDb((prev) => ({
    ...prev,
    seq: { ...prev.seq, AUD: seqRef.current.AUD },
    auditLogs: [{ id, data: new Date().toISOString(), utilizador, accao, entidade, entidadeId }, ...(prev.auditLogs || [])],
  }));
}

function randCode(name) {
  const base = (name || "PARC").replace(/[^A-Za-z]/g, "").slice(0, 6).toUpperCase() || "PARC";
  return base + Math.floor(10 + Math.random() * 90);
}

/* ======================================================================

====================================================================== */
function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms)),
  ]);
}

const CORE_TABLES = ["campaigns", "influencers", "leads", "clients", "sales", "commissions"];
const CORE_SINGULAR = { campaigns: "campaign", influencers: "influencer", leads: "lead", clients: "client", sales: "sale", commissions: "commission" };
const LOCAL_TABLES = ["scripts", "diagnostics", "vip_members", "documents", "tasks", "commission_payments"];
const LOCAL_SINGULAR = { scripts: "script", diagnostics: "diagnostic", vip_members: "vip", documents: "document", tasks: "task", commission_payments: "payment" };
const LOCAL_KEY = { scripts: "scripts", diagnostics: "diagnostics", vip_members: "vipMembers", documents: "documents", tasks: "tasks", commission_payments: "payments" };

async function fetchAllData(accessToken) {
  const corePromise = Promise.all(
    CORE_TABLES.map((t) => sbTable(t, accessToken).list().then((rows) => (rows || []).map(mapIn[CORE_SINGULAR[t]])))
  );
  const localPromise = Promise.all(
    LOCAL_TABLES.map((t) => sbTable(t, accessToken).list().then((rows) => (rows || []).map(mapIn[LOCAL_SINGULAR[t]])))
  );
  const [core, local, whatsappRows, settingsRows, paymentItemRows, auditRows] = await Promise.all([
    corePromise,
    localPromise,
    sbFetch(`/rest/v1/whatsapp_groups?select=*&limit=1`, { accessToken }),
    sbFetch(`/rest/v1/settings?select=*&limit=1`, { accessToken }),
    sbFetch(`/rest/v1/commission_payment_items?select=*`, { accessToken }),
    sbFetch(`/rest/v1/audit_logs?select=*&order=data.desc&limit=100`, { accessToken }),
  ]);

  const out = { campaigns: core[0], influencers: core[1], leads: core[2], clients: core[3], sales: core[4], commissions: core[5] };
  LOCAL_TABLES.forEach((t, i) => { out[LOCAL_KEY[t]] = local[i]; });

  // liga cada pagamento às suas comissões (tabela de junção)
  out.payments = out.payments.map((p) => ({
    ...p,
    commissionIds: (paymentItemRows || []).filter((it) => it.payment_id === p.id).map((it) => it.commission_id),
  }));

  out.whatsapp = whatsappRows && whatsappRows[0] ? mapIn.whatsapp(whatsappRows[0]) : null;
  out.settings = settingsRows && settingsRows[0] ? mapIn.settings(settingsRows[0]) : null;
  out.auditLogs = (auditRows || []).map((r) => ({ id: r.id, data: r.data, utilizador: r.utilizador || "Admin", accao: r.accao, entidade: r.entidade, entidadeId: r.entidade_id }));

  return out;
}

function useDB(accessToken) {
  const [db, setDb] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saveError, setSaveError] = useState(false);
  const [loadError, setLoadError] = useState(false);

  const loadOnce = useCallback(async () => {
    if (!accessToken) return;
    setLoading(true);
    setLoadError(false);
    let base;
    try {
      const res = await withTimeout(window.storage.get(STORE_KEY, false), 6000);
      base = res && res.value ? JSON.parse(res.value) : seedData();
    } catch (e) {
      base = seedData();
    }
    try {
      const remote = await withTimeout(fetchAllData(accessToken), 12000);
      // A Supabase é a fonte da verdade para todos os módulos já ligados — substitui os dados locais.
      // whatsapp/settings ainda não têm linha na base de dados na primeira vez que a app corre.
      setDb({
        ...base, ...remote,
        whatsapp: remote.whatsapp || base.whatsapp,
        settings: remote.settings || base.settings,
      });
    } catch (e) {
      // Sem ligação à base de dados real: continua com o que houver localmente para a app não ficar presa.
      setDb(base);
      setLoadError(true);
    } finally {
      setLoading(false);
    }
  }, [accessToken]);

  useEffect(() => { loadOnce(); }, [loadOnce]);

  useEffect(() => {
    if (!db || loading) return;
    const t = setTimeout(async () => {
      try {
        const r = await withTimeout(window.storage.set(STORE_KEY, JSON.stringify(db), false), 6000);
        setSaveError(!r);
      } catch (e) {
        setSaveError(true);
      }
    }, 250);
    return () => clearTimeout(t);
  }, [db, loading]);

  return [db, setDb, loading, saveError, loadError, loadOnce];
}

/* ======================================================================

====================================================================== */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ background: C.paper, ...fontBody }} className="min-h-screen flex items-center justify-center p-6">
          <div style={{ background: C.card, borderColor: C.line }} className="border rounded-2xl p-6 max-w-sm w-full text-center">
            <div style={{ background: C.redTint }} className="w-12 h-12 rounded-2xl flex items-center justify-center mx-auto mb-4">
              <AlertTriangle size={22} style={{ color: C.red }} />
            </div>
            <p style={{ ...fontDisplay, color: C.ink }} className="font-semibold mb-1">Algo correu mal</p>
            <p style={{ color: C.muted }} className="text-sm mb-5">A aplicação encontrou um erro inesperado. Os teus dados guardados não foram perdidos.</p>
            <PrimaryButton full icon={RefreshCw} onClick={() => { this.setState({ error: null }); }}>Tentar novamente</PrimaryButton>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function TestConnectionButton() {
  const [state, setState] = useState("idle"); // idle | testing | ok | fail
  const [detail, setDetail] = useState("");

  const test = async () => {
    setState("testing");
    setDetail("");
    try {
      const res = await withTimeout(
        fetch(`${SUPABASE_URL}/rest/v1/`, { headers: { apikey: SUPABASE_ANON_KEY } }),
        8000
      );
      if (res.ok || res.status === 404) {
        setState("ok");
      } else {
        setState("fail");
        setDetail(`HTTP ${res.status}`);
      }
    } catch (err) {
      setState("fail");
      setDetail(err.message === "timeout" ? "sem resposta em 8s" : (err.message || "erro de rede"));
    }
  };

  return (
    <div className="mt-3">
      <button type="button" onClick={test} style={{ color: C.green, ...fontBody }} className="text-xs font-semibold underline">
        {state === "testing" ? "A testar…" : "Testar ligação à base de dados"}

      )}
      {state === "fail" && (
        <p style={{ color: C.red, ...fontBody }} className="text-xs mt-1.5 font-semibold">Falha de ligação ({detail}) — esta pré-visualização pode estar a bloquear pedidos de rede externos.</p>
      )}
    </div>
  );
}

function LoginGate({ onLogin }) {
  useBrandFonts();
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const inFlight = React.useRef(false);

  const submit = async (e) => {
    if (e && e.preventDefault) e.preventDefault();
    if (inFlight.current) return; // evita disparo duplicado se o botão for tocado duas vezes
    inFlight.current = true;
    setError("");
    setBusy(true);
    try {
      const data = await withTimeout(sbLogin(email.trim(), password), 10000);
      if (!data || !data.access_token) throw new Error(data?.error_description || data?.msg || "Credenciais inválidas");
      onLogin({ accessToken: data.access_token, email: data.user?.email || email, userId: data.user?.id });
    } catch (err) {
      const raw = err && err.message ? err.message : String(err);
      const friendly =
        raw === "timeout" ? "O pedido demorou demasiado — verifica a tua ligação e tenta de novo."
        : raw === "Failed to fetch" || raw.includes("NetworkError") ? "Não foi possível ligar à base de dados (falha de rede nesta pré-visualização)."
        : raw.toLowerCase().includes("invalid") ? "Email ou password incorrectos."
        : `Erro: ${raw}`;
      setError(friendly);
    } finally {
      setBusy(false);
      inFlight.current = false;
    }
  };

  return (
    <div style={{ background: C.green, ...fontBody }} className="min-h-screen flex items-center justify-center p-6">
      <div style={{ background: C.card }} className="w-full max-w-sm rounded-3xl p-7 shadow-2xl">
        <div style={{ background: C.green }} className="w-14 h-14 rounded-2xl flex items-center justify-center mb-5">
          <span style={{ ...fontDisplay, color: C.gold }} className="text-xl font-bold">NM</span>
        </div>
        <p style={{ ...fontDisplay, color: C.ink }} className="text-2xl font-semibold leading-tight">Negócios Múltiplos</p>
        <p style={{ color: C.gold, ...fontBody }} className="text-xs font-bold uppercase tracking-[0.14em] mb-6">Influencer Partner OS</p>
        <form onSubmit={submit}>
          <Field label="Email">
            <TextInput type="email" required value={email} onChange={(e) => setEmail(e.target.value)} autoFocus autoComplete="username" enterKeyHint="next" />
          </Field>
          <Field label="Password" hint={error || "Conta de administrador criada no Supabase."}>
            <TextInput type="password" required value={password} onChange={(e) => setPassword(e.target.value)} autoComplete="current-password" enterKeyHint="go" />
          </Field>
          <PrimaryButton type="submit" full icon={busy ? RefreshCw : ShieldCheck} onClick={submit}>
            {busy ? "A entrar…" : "Entrar"}
          </PrimaryButton>
        </form>
        <TestConnectionButton />
        <p style={{ color: C.muted }} className="text-xs mt-5 leading-relaxed">
          Login real ligado à tua base de dados Supabase. A sessão fica activa só enquanto este ecrã estiver aberto — se saíres e voltares, precisas de entrar outra vez.
        </p>
      </div>
    </div>
  );
}

====================================================================== */
const PERIODS = ["Hoje", "7 dias", "30 dias", "Este mês", "Tudo"];
function withinPeriod(dateStr, period) {
  if (!dateStr || period === "Tudo") return true;
  const d = new Date(dateStr);
  const now = new Date();
  if (period === "Hoje") return dateStr === todayISO();
  if (period === "7 dias") return d >= new Date(daysAgo(7));
  if (period === "30 dias") return d >= new Date(daysAgo(30));
  if (period === "Este mês") return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  return true;
}

            style={{

              color: active ? "white" : C.ink,
              borderColor: C.line,
            }}

          >

          </button>
        );
      })}
    </div>
  );
}

function Dashboard({ db }) {
  const [period, setPeriod] = useState("30 dias");

  const salesInPeriod = db.sales.filter((s) => withinPeriod(s.data, period));
  const leadsInPeriod = db.leads.filter((l) => withinPeriod(l.dataEntrada, period));
  const validated = salesInPeriod.filter((s) => s.estado === "Validada");
  const receita = validated.reduce((sum, s) => sum + Number(s.preco), 0);

  const commissionsRelevant = db.commissions.filter((c) =>
    validated.some((s) => s.id === c.saleId) || withinPeriod(c.historico?.[0]?.data, period)
  );
  const comissoesGeradas = db.commissions.filter((c) => c.estado !== "Cancelada").reduce((s, c) => s + Number(c.valor), 0);
  const comissoesPendentes = db.commissions.filter((c) => ["Gerada", "Disponível", "Solicitada"].includes(c.estado)).reduce((s, c) => s + Number(c.valor), 0);
  const comissoesPagas = db.commissions.filter((c) => c.estado === "Paga").reduce((s, c) => s + Number(c.valor), 0);

  const influencersActivos = db.influencers.filter((i) => i.estado === "Activo").length;
  const clientesActivos = db.clients.filter((c) => c.estado === "Activo" || c.estado === "Em acompanhamento").length;
  const clientesConcluidos = db.clients.filter((c) => c.estado === "Concluído").length;

  const kpis = [
    { label: "Influencers activos", value: influencersActivos, of: `${db.influencers.length} total`, icon: Users },
    { label: "Leads no período", value: leadsInPeriod.length, of: `${db.leads.length} total`, icon: Target },
    { label: "Vendas validadas", value: validated.length, of: `${salesInPeriod.length} no período`, icon: CircleDollarSign },
    { label: "Receita bruta", value: formatKz(receita), icon: TrendingUp, big: true },
    { label: "Comissões geradas", value: formatKz(comissoesGeradas), icon: Coins, big: true },
    { label: "Comissões pendentes", value: formatKz(comissoesPendentes), icon: Wallet, big: true, tone: "gold" },
    { label: "Comissões pagas", value: formatKz(comissoesPagas), icon: Check, big: true, tone: "green" },
    { label: "Clientes em acompanhamento", value: clientesActivos, of: `${clientesConcluidos} concluíram`, icon: UserCheck },
  ];

  const salesByDay = useMemo(() => {
    const days = Array.from({ length: 14 }).map((_, i) => daysAgo(13 - i));
    return days.map((d) => ({
      day: d.slice(5),
      vendas: db.sales.filter((s) => s.data === d && s.estado === "Validada").length,
    }));
  }, [db.sales]);

  const salesByInfluencer = useMemo(() => {
    return db.influencers.map((inf) => ({
      name: (inf.nomeArtistico || inf.nome).split(" ")[0],
      vendas: db.sales.filter((s) => s.influencerId === inf.id && s.estado === "Validada").length,
      comissao: db.commissions.filter((c) => c.influencerId === inf.id && c.estado !== "Cancelada").reduce((s, c) => s + Number(c.valor), 0),
    }));
  }, [db.influencers, db.sales, db.commissions]);

  return (
    <div className="pb-6">
      <PeriodFilter value={period} onChange={setPeriod} />

      <div className="grid grid-cols-2 gap-3 mt-4">
        {kpis.map((k) => (

            </div>
            <p style={{ ...fontDisplay, color: C.ink }} className={`font-semibold leading-tight ${k.big ? "text-lg" : "text-2xl"}`}>{k.value}</p>
            <p style={{ color: C.muted }} className="text-[11px] mt-1 leading-tight">{k.label}</p>
            {k.of && <p style={{ color: C.muted }} className="text-[10px] opacity-70">{k.of}</p>}
          </div>
        ))}
      </div>

      <SectionCard title="Vendas validadas · últimos 14 dias">
        <div style={{ height: 180 }}>
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={salesByDay}>
              <CartesianGrid vertical={false} stroke={C.line} />
              <XAxis dataKey="day" tick={{ fontSize: 10, fill: C.muted }} axisLine={false} tickLine={false} interval={2} />
              <YAxis allowDecimals={false} tick={{ fontSize: 10, fill: C.muted }} axisLine={false} tickLine={false} width={22} />

      <SectionCard title="Vendas e comissão por influencer">
        <div style={{ height: 200 }}>
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={salesByInfluencer}>
              <CartesianGrid vertical={false} stroke={C.line} />
              <XAxis dataKey="name" tick={{ fontSize: 10, fill: C.muted }} axisLine={false} tickLine={false} />
              <YAxis allowDecimals={false} tick={{ fontSize: 10, fill: C.muted }} axisLine={false} tickLine={false} width={22} />
              <Tooltip contentStyle={{ borderRadius: 10, borderColor: C.line, fontSize: 12 }} formatter={(v, n) => (n === "comissao" ? formatKz(v) : v)} />

====================================================================== */
const INF_ESTADOS = ["Prospect", "Contactado", "Respondeu", "Interessado", "Em negociação", "Aprovado", "Onboarding", "Activo", "Pausado", "Suspenso", "Encerrado"];

function emptyInfluencer() {
  return {
    nome: "", nomeArtistico: "", username: "", plataforma: "Instagram", telefone: "", whatsapp: "",
    email: "", cidade: "", pais: "Angola", nicho: "", seguidores: "", engagement: "", estado: "Prospect",
    dataEntrada: todayISO(), codigo: "", codigoAtivo: true, metaVendas: "", observacoes: "",
    banco: "", titular: "", iban: "",
  };
}

function InfluencersView({ db, setDb, seqRef, persistSeq, flash, accessToken }) {
  const [query, setQuery] = useState("");
  const [sheet, setSheet] = useState(null); // {mode:'new'|'edit', data}
  const [detail, setDetail] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [revealSensitive, setRevealSensitive] = useState({});
  const [busy, setBusy] = useState(false);
  const api = sbTable("influencers", accessToken);

  const list = db.influencers.filter((i) => {
    const q = query.toLowerCase();
    return !q || i.nome.toLowerCase().includes(q) || (i.nomeArtistico || "").toLowerCase().includes(q) || (i.codigo || "").toLowerCase().includes(q) || i.telefone.includes(q);
  });

  const bApi = bankingApi(accessToken);
  const save = async (data) => {
    setBusy(true);
    try {
      let influencerId = data.id;
      if (data.id) {
        const row = await api.update(data.id, mapOut.influencer(data));
        const updated = mapIn.influencer(row);
        setDb((prev) => ({ ...prev, influencers: prev.influencers.map((i) => (i.id === updated.id ? updated : i)) }));
        flash("Influencer actualizado");
      } else {
        const codesActive = db.influencers.filter((i) => i.codigoAtivo).map((i) => i.codigo);
        let codigo = data.codigo || randCode(data.nomeArtistico || data.nome);
        while (codesActive.includes(codigo)) codigo = randCode(data.nomeArtistico || data.nome);
        const payload = mapOut.influencer({ ...data, codigo, codigoAtivo: true });
        const row = await api.insert(payload);
        const created = mapIn.influencer(row);
        influencerId = created.id;
        setDb((prev) => ({ ...prev, influencers: [created, ...prev.influencers] }));
        flash("Influencer criado");
      }
      // dados bancários gravam à parte, na tabela isolada influencer_banking
      if (data.titular || data.banco || data.iban) {
        try { await bApi.upsert(influencerId, data); } catch (e) { flash(`Influencer guardado, mas os dados bancários falharam: ${e.message}`); }
      }
      setSheet(null);
    } catch (e) {
      flash(`Erro ao guardar: ${e.message}`);
    } finally {
      setBusy(false);
    }
  };

  const remove = async (id) => {
    setBusy(true);
    try {
      await api.remove(id);
      setDb((prev) => ({ ...prev, influencers: prev.influencers.filter((i) => i.id !== id) }));
      try {
        const logRow = await sbFetch(`/rest/v1/audit_logs`, {
          method: "POST", accessToken, prefer: "return=representation",
          body: { accao: `Influencer ${id} eliminado`, entidade: "influencer", entidade_id: id },
        });
        if (logRow?.[0]) {
          const l = logRow[0];
          setDb((prev) => ({ ...prev, auditLogs: [{ id: l.id, data: l.data, utilizador: "Admin", accao: l.accao, entidade: l.entidade, entidadeId: l.entidade_id }, ...prev.auditLogs] }));
        }
      } catch (e) { /* log é best-effort — não bloqueia a eliminação */ }
      setConfirmDel(null);
      setDetail(null);
      flash("Influencer eliminado");
    } catch (e) {
      flash(`Erro ao eliminar: ${e.message}`);
    } finally {
      setBusy(false);
    }
  };

  const archive = async (inf) => {
    try {
      const row = await api.update(inf.id, { estado: "Encerrado" });
      const updated = mapIn.influencer(row);
      setDb((prev) => ({ ...prev, influencers: prev.influencers.map((i) => (i.id === inf.id ? updated : i)) }));
      flash("Influencer arquivado");
    } catch (e) {
      flash(`Erro: ${e.message}`);
    }
  };

  return (
    <div className="pb-6">
      <ListHeader query={query} setQuery={setQuery} placeholder="Procurar por nome, código, telefone…" onAdd={() => setSheet({ mode: "new", data: emptyInfluencer() })} addLabel="Novo influencer" />

      {list.length === 0 ? (
        <EmptyState icon={Users} title="Sem influencers" subtitle="Adiciona o primeiro parceiro para começar a acompanhar vendas e comissões." action={<PrimaryButton icon={Plus} onClick={() => setSheet({ mode: "new", data: emptyInfluencer() })}>Novo influencer</PrimaryButton>} />
      ) : (
        <div className="grid gap-3">
          {list.map((inf) => {
            const vendas = db.sales.filter((s) => s.influencerId === inf.id && s.estado === "Validada").length;
            const comissao = db.commissions.filter((c) => c.influencerId === inf.id && c.estado !== "Cancelada").reduce((s, c) => s + Number(c.valor), 0);
            return (
              <div key={inf.id} onClick={() => setDetail(inf)} style={{ background: C.card, borderColor: C.line }} className="rounded-2xl border p-4 active:scale-[0.99] transition cursor-pointer">
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <p style={{ ...fontDisplay, color: C.ink }} className="font-semibold truncate">{inf.nomeArtistico || inf.nome}</p>
                    <p style={{ color: C.muted }} className="text-xs truncate">{inf.username || inf.nome} · {inf.plataforma}</p>
                  </div>
                  <StatusPill status={inf.estado} />
                </div>
                <div className="flex items-center gap-4 mt-3 text-xs" style={{ color: C.muted }}>
                  <span><b style={{ color: C.ink }}>{vendas}</b> vendas</span>
                  <span><b style={{ color: C.ink }}>{formatKz(comissao)}</b> comissão</span>
                  {inf.codigo && <Pill tone="gold">{inf.codigo}</Pill>}
                </div>
                <ContactRow phone={inf.telefone} whatsapp={inf.whatsapp} email={inf.email} />
              </div>
            );
          })}
        </div>
      )}

      <Sheet open={!!sheet} onClose={() => setSheet(null)} title={sheet?.mode === "new" ? "Novo influencer" : "Editar influencer"}>
        {sheet && <InfluencerForm data={sheet.data} accessToken={accessToken} onCancel={() => setSheet(null)} onSave={save} />}
      </Sheet>

      <Sheet open={!!detail} onClose={() => setDetail(null)} title={detail?.nomeArtistico || detail?.nome} subtitle={detail?.codigo}>
        {detail && (
          <InfluencerDetail
            inf={detail}
            db={db}
            accessToken={accessToken}
            revealed={!!revealSensitive[detail.id]}
            onToggleReveal={() => setRevealSensitive((r) => ({ ...r, [detail.id]: !r[detail.id] }))}
            onEdit={() => { setSheet({ mode: "edit", data: detail }); }}
            onArchive={() => archive(detail)}
            onDelete={() => setConfirmDel(detail)}
          />
        )}
      </Sheet>

      <ConfirmDialog
        open={!!confirmDel}
        title="Eliminar influencer?"
        body="Esta operação poderá afectar leads, vendas e comissões relacionadas. Considera arquivar em vez de eliminar."
        confirmLabel="Eliminar"
        danger
        onCancel={() => setConfirmDel(null)}
        onConfirm={() => confirmDel && remove(confirmDel.id)}
      />
    </div>
  );
}

      <p style={{ color: C.gold, ...fontBody }} className="text-xs font-bold uppercase tracking-wide mb-3 mt-2">Dados profissionais</p>
      <div className="grid grid-cols-2 gap-3">

          <Select value={form.plataforma} onChange={set("plataforma")}>

        </Field>

      <div className="grid grid-cols-2 gap-3">
        <Field label="Seguidores"><TextInput type="number" value={form.seguidores} onChange={set("seguidores")} /></Field>

      <div className="grid grid-cols-2 gap-3">

      </div>
      <Field label="Observações"><TextArea rows={3} value={form.observacoes} onChange={set("observacoes")} /></Field>

      <p style={{ color: C.gold, ...fontBody }} className="text-xs font-bold uppercase tracking-wide mb-3 mt-2">Dados financeiros (sensível) {loadingBank && "· a carregar…"}</p>
      <Field label="Titular da conta"><TextInput value={form.titular} onChange={set("titular")} /></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Banco"><TextInput value={form.banco} onChange={set("banco")} /></Field>
        <Field label="IBAN"><TextInput value={form.iban} onChange={set("iban")} /></Field>
      </div>

      <div className="flex gap-2 mt-4 sticky bottom-0 pt-2" style={{ background: C.paper }}>
        <GhostButton onClick={onCancel} full>Cancelar</GhostButton>
        <PrimaryButton type="submit" full icon={Check}>Guardar</PrimaryButton>

  );

function InfluencerDetail({ inf, db, accessToken, revealed, onToggleReveal, onEdit, onArchive, onDelete }) {

   LEADS
====================================================================== */
const LEAD_ESTADOS = ["Novo", "Contactado", "Diagnóstico", "Interessado", "Oferta apresentada", "Pagamento solicitado", "Pago", "Não interessado", "Follow-up", "Perdido", "Convertido"];

function emptyLead(campaignId) {
  return { nome: "", telefone: "", influencerId: "", campaignId: campaignId || "", estado: "Novo", dataEntrada: todayISO(), observacoes: "" };
}

function LeadsView({ db, setDb, seqRef, persistSeq, flash, accessToken }) {
  const [query, setQuery] = useState("");
  const [sheet, setSheet] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [confirmConvert, setConfirmConvert] = useState(null);
  const api = sbTable("leads", accessToken);
  const clientsApi = sbTable("clients", accessToken);

  const list = db.leads.filter((l) => !query || l.nome.toLowerCase().includes(query.toLowerCase()) || l.telefone.includes(query));

  const save = async (data) => {
    try {
      if (data.id) {
        const row = await api.update(data.id, mapOut.lead(data));
        const updated = mapIn.lead(row);
        setDb((prev) => ({ ...prev, leads: prev.leads.map((l) => (l.id === updated.id ? updated : l)) }));
        flash("Lead actualizado");
      } else {
        const row = await api.insert(mapOut.lead(data));
        const created = mapIn.lead(row);
        setDb((prev) => ({ ...prev, leads: [created, ...prev.leads] }));
        flash("Lead criado");
      }
      setSheet(null);
    } catch (e) {
      flash(`Erro ao guardar: ${e.message}`);
    }
  };

  const remove = async (id) => {
    try {
      await api.remove(id);
      setDb((prev) => ({ ...prev, leads: prev.leads.filter((l) => l.id !== id) }));
      setConfirmDel(null);
      flash("Lead eliminado");
    } catch (e) {
      flash(`Erro ao eliminar: ${e.message}`);
    }
  };

  const convertToClient = async (lead) => {
    const existing = db.clients.find((c) => c.telefone === lead.telefone);
    if (existing) {
      flash("Já existe um cliente com este telefone");
      setConfirmConvert(null);
      return;
    }
    try {
      const clientPayload = mapOut.client({
        nome: lead.nome, telefone: lead.telefone, influencerId: lead.influencerId, campaignId: lead.campaignId,
        produtoAdquirido: "12 Formas de Gerar Rendimentos em Angola", dataCompra: todayISO(), valor: 0,
        estado: "Activo", diaAcompanhamento: 0, observacoes: `Convertido a partir do lead ${lead.id}.`,
      });
      const clientRow = await clientsApi.insert(clientPayload);
      const client = mapIn.client(clientRow);
      const leadRow = await api.update(lead.id, { estado: "Convertido" });
      const updatedLead = mapIn.lead(leadRow);
      setDb((prev) => ({
        ...prev,
        clients: [client, ...prev.clients],
        leads: prev.leads.map((l) => (l.id === lead.id ? updatedLead : l)),
      }));
      setConfirmConvert(null);
      flash("Lead convertido em cliente");
    } catch (e) {
      flash(`Erro ao converter: ${e.message}`);
    }
  };

  return (
    <div className="pb-6">
      <ListHeader query={query} setQuery={setQuery} placeholder="Procurar lead…" onAdd={() => setSheet({ mode: "new", data: emptyLead() })} addLabel="Novo lead" />

      {list.length === 0 ? (
        <EmptyState icon={Target} title="Sem leads" subtitle="Regista o primeiro contacto vindo do grupo de WhatsApp." action={<PrimaryButton icon={Plus} onClick={() => setSheet({ mode: "new", data: emptyLead() })}>Novo lead</PrimaryButton>} />
      ) : (
        <div className="grid gap-3">
          {list.map((l) => {
            const inf = db.influencers.find((i) => i.id === l.influencerId);
            return (
              <div key={l.id} style={{ background: C.card, borderColor: C.line }} className="rounded-2xl border p-4">
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <p style={{ ...fontDisplay, color: C.ink }} className="font-semibold truncate">{l.nome}</p>
                    <p style={{ color: C.muted }} className="text-xs truncate">{inf ? (inf.nomeArtistico || inf.nome) : "Sem influencer"} {inf?.codigo ? `· ${inf.codigo}` : ""}</p>
                  </div>
                  <StatusPill status={l.estado} />
                </div>
                <ContactRow phone={l.telefone} whatsapp={l.telefone} />
                <div className="flex items-center gap-2 mt-3">
                  <button onClick={() => setSheet({ mode: "edit", data: l })} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.green }}><Pencil size={12} /> Editar</button>
                  {l.estado !== "Convertido" && (
                    <button onClick={() => setConfirmConvert(l)} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.gold }}><ChevronRight size={12} /> Converter em cliente</button>
                  )}
                  <button onClick={() => setConfirmDel(l)} className="text-xs font-semibold flex items-center gap-1 ml-auto" style={{ color: C.red }}><Trash2 size={12} /></button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <Sheet open={!!sheet} onClose={() => setSheet(null)} title={sheet?.mode === "new" ? "Novo lead" : "Editar lead"}>
        {sheet && <LeadForm data={sheet.data} db={db} onCancel={() => setSheet(null)} onSave={save} />}
      </Sheet>

      <ConfirmDialog open={!!confirmDel} title="Eliminar lead?" body="Esta acção não pode ser desfeita." confirmLabel="Eliminar" danger onCancel={() => setConfirmDel(null)} onConfirm={() => confirmDel && remove(confirmDel.id)} />
      <ConfirmDialog open={!!confirmConvert} title="Converter lead em cliente?" body="Vai criar um novo registo de cliente associado a este lead." confirmLabel="Converter" onCancel={() => setConfirmConvert(null)} onConfirm={() => confirmConvert && convertToClient(confirmConvert)} />
    </div>
  );
}

function LeadForm({ data, db, onCancel, onSave }) {
  const [form, setForm] = useState(data);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  return (
    <form onSubmit={(e) => { e.preventDefault(); onSave(form); }}>
      <Field label="Nome"><TextInput required value={form.nome} onChange={set("nome")} /></Field>
      <Field label="Telefone / WhatsApp"><TextInput required value={form.telefone} onChange={set("telefone")} /></Field>
      <Field label="Influencer de origem">
        <Select value={form.influencerId} onChange={set("influencerId")}>
          <option value="">Sem atribuição</option>
          {db.influencers.map((i) => <option key={i.id} value={i.id}>{i.nomeArtistico || i.nome} ({i.codigo})</option>)}
        </Select>
      </Field>
      <Field label="Campanha">
        <Select value={form.campaignId} onChange={set("campaignId")}>
          <option value="">—</option>
          {db.campaigns.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}
        </Select>
      </Field>
      <Field label="Estado">
        <Select value={form.estado} onChange={set("estado")}>
          {LEAD_ESTADOS.map((s) => <option key={s}>{s}</option>)}
        </Select>
      </Field>
      <Field label="Observações"><TextArea rows={3} value={form.observacoes} onChange={set("observacoes")} /></Field>
      <div className="flex gap-2 mt-2">
        <GhostButton onClick={onCancel} full>Cancelar</GhostButton>
        <PrimaryButton type="submit" full icon={Check}>Guardar</PrimaryButton>
      </div>
    </form>
  );
}

const CLI_ESTADOS = ["Activo", "Em acompanhamento", "Concluído", "Pausado", "Reembolsado", "Encerrado"];

function ClientesView({ db, setDb, seqRef, persistSeq, flash, accessToken }) {
  const [query, setQuery] = useState("");
  const [sheet, setSheet] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const api = sbTable("clients", accessToken);

  const list = db.clients.filter((c) => !query || c.nome.toLowerCase().includes(query.toLowerCase()) || c.telefone.includes(query));

  const save = async (data) => {
    try {
      if (data.id) {
        const row = await api.update(data.id, mapOut.client(data));
        const updated = mapIn.client(row);
        setDb((prev) => ({ ...prev, clients: prev.clients.map((c) => (c.id === updated.id ? updated : c)) }));
        flash("Cliente actualizado");
      } else {
        const row = await api.insert(mapOut.client(data));
        const created = mapIn.client(row);
        setDb((prev) => ({ ...prev, clients: [created, ...prev.clients] }));
        flash("Cliente criado");
      }
      setSheet(null);
    } catch (e) {
      flash(`Erro ao guardar: ${e.message}`);
    }
  };

  const remove = async (id) => {
    try {
      await api.remove(id);
      setDb((prev) => ({ ...prev, clients: prev.clients.filter((c) => c.id !== id) }));
      setConfirmDel(null);
      flash("Cliente eliminado");
    } catch (e) {
      flash(`Erro ao eliminar: ${e.message}`);
    }
  };

  return (
    <div className="pb-6">
      <ListHeader query={query} setQuery={setQuery} placeholder="Procurar cliente…" onAdd={() => setSheet({ mode: "new", data: emptyClient() })} addLabel="Novo cliente" />
      {list.length === 0 ? (
        <EmptyState icon={UserCheck} title="Sem clientes" subtitle="Os clientes aparecem aqui após uma venda validada ou conversão de lead." action={<PrimaryButton icon={Plus} onClick={() => setSheet({ mode: "new", data: emptyClient() })}>Novo cliente</PrimaryButton>} />
      ) : (
        <div className="grid gap-3">
          {list.map((c) => {
            const inf = db.influencers.find((i) => i.id === c.influencerId);
            return (
              <div key={c.id} style={{ background: C.card, borderColor: C.line }} className="rounded-2xl border p-4">
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <p style={{ ...fontDisplay, color: C.ink }} className="font-semibold truncate">{c.nome}</p>
                    <p style={{ color: C.muted }} className="text-xs truncate">via {inf ? (inf.nomeArtistico || inf.nome) : "—"} · {formatKz(c.valor)}</p>
                  </div>
                  <StatusPill status={c.estado} />
                </div>
                {c.estado === "Em acompanhamento" && (
                  <div className="mt-2.5">
                    <div className="flex items-center justify-between text-[11px] mb-1" style={{ color: C.muted }}>
                      <span>Dia {c.diaAcompanhamento}/30</span>
                      <span>{Math.round((c.diaAcompanhamento / 30) * 100)}%</span>
                    </div>
                    <div style={{ background: "#F1F0EC" }} className="h-1.5 rounded-full overflow-hidden">
                      <div style={{ background: C.gold, width: `${Math.min(100, (c.diaAcompanhamento / 30) * 100)}%` }} className="h-full rounded-full" />
                    </div>
                  </div>
                )}
                <ContactRow phone={c.telefone} whatsapp={c.telefone} />
                <div className="flex items-center gap-2 mt-3">
                  <button onClick={() => setSheet({ mode: "edit", data: c })} className="text-xs font-semibold flex items-center gap-1" style={{ color: C.green }}><Pencil size={12} /> Editar</button>
                  <button onClick={() => setConfirmDel(c)} className="text-xs font-semibold flex items-center gap-1 ml-auto" style={{ color: C.red }}><Trash2 size={12} /></button>
                </div>
              </div>
            );
          })}
        </div>
      )}
      <Sheet open={!!sheet} onClose={() => setSheet(null)} title={sheet?.mode === "new" ? "Novo cliente" : "Editar cliente"}>
        {sheet && <ClientForm data={sheet.data} db={db} onCancel={() => setSheet(null)} onSave={save} />}
      </Sheet>
      <ConfirmDialog open={!!confirmDel} title="Eliminar cliente?" body="Esta operação poderá afectar vendas relacionadas." confirmLabel="Eliminar" danger onCancel={() => setConfirmDel(null)} onConfirm={() => confirmDel && remove(confirmDel.id)} />
    </div>
  );
}
